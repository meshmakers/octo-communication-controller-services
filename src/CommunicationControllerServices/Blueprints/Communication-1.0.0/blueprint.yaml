$schema: https://schemas.meshmakers.cloud/blueprint-meta.schema.json
blueprintId: Communication-1.0.0
description: |
  Production base blueprint for the Communication module. Seeds a Cloud-environment
  Pool and one managed Adapter on the active tenant so a freshly enabled tenant
  has a working deployment target without manually wiring the two entities. The
  optional HelloCommunication blueprint sits on top of this one and adds a
  hello-world Pipeline for demos.

ckModelDependencies:
  - System.Communication-[3.0,4.0)

seedDataPath: seed-data/entities.yaml
