$schema: https://schemas.meshmakers.cloud/blueprint-meta.schema.json
blueprintId: HelloCommunication-1.0.0
description: |
  Optional demo blueprint that adds a single-node hello-world Pipeline to the
  Adapter shipped by the base Communication blueprint. Apply this on top of
  Communication to get an immediate, plakativ end-to-end signal — trigger the
  pipeline manually and the Logger node writes a hello banner to the adapter
  log. Install only on demo or training tenants; not intended for production.

blueprintDependencies:
  - Communication-[1.0,2.0)

# CK model dependencies are inherited via the Communication dependency; the
# engine resolves the transitive closure on apply.

seedDataPath: seed-data/entities.yaml
