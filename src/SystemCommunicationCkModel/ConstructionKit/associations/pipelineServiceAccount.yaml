$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
associationRoles:
  # AB#5027 (Epic AB#4979 — "pipeline execution has a real identity").
  #
  # Dedicated role instead of reusing the generic "Uses" role, for exactly the reason
  # documented on the HelmRepository link in types/deployableWorkload.yaml: a second
  # origin type on "Uses" flips the inverse "UsedBy" view on Configuration from
  # Pipeline_UsedByUnionConnection to a union connection, and the CK engine then drops
  # SystemConfigurationInterface from the generated GraphQL schema for *every*
  # Configuration subtype. A dedicated role keeps both inverse views distinct.
  #
  # Multiplicity is ZeroOrOne — "at most one, but OPTIONAL" — on purpose:
  #   * at most one, because "the service account this adapter's pipelines run as" is a
  #     single identity; a set would make the resolution non-deterministic.
  #   * optional, because the *obligation* is enforced by the deploy guard in
  #     AdapterService (EnsurePipelineHasServiceAccountAsync), NOT by the model. A
  #     mandatory multiplicity (One) would reject every existing Adapter entity on the
  #     next blueprint re-apply / ImportRt — before any tenant has a service account at
  #     all, and before the provisioning phase that creates one even exists. It would
  #     also reclassify this additive change as a MAJOR CK bump (see
  #     octo-construction-kit-engine/docs/ck-semver-rules.md: "new association
  #     referencing a role with multiplicity One" => Major).
  - id: PipelineServiceAccount
    description: Links an Adapter to the ServiceAccountConfiguration whose client credentials its pipelines execute under (AB#5027). Acts as the adapter-wide default; a single pipeline may override it by linking its own ServiceAccountConfiguration through the generic Uses role. Separate from Uses so the inverse view on Configuration stays Pipeline-scoped and SystemConfigurationInterface survives in the generated GraphQL schema.
    inboundName: PipelineServiceAccountOf
    inboundMultiplicity: N
    outboundName: PipelineServiceAccount
    outboundMultiplicity: ZeroOrOne
