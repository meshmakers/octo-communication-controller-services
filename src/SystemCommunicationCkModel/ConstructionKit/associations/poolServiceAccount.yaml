$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
associationRoles:
  # AB#4924 — the management identity of an adapter pool. See the rationale on the
  # association in types/adapterPool.yaml: this is a dedicated role rather than a second
  # origin type on PipelineServiceAccount, because a second origin flips the inverse UsedBy
  # union view on ServiceAccountConfiguration and the CK engine then drops
  # SystemConfigurationInterface from the generated schema for every Configuration subtype.
  #
  # ZeroOrOne rather than One for the same reason as PipelineServiceAccount: the obligation
  # ("a pool MUST have a management identity") belongs to the deploy guard, where it can be
  # reported with a reason, not to a multiplicity that would reject every AdapterPool entity
  # on a blueprint re-apply before the account is provisioned — and that would additionally
  # make any later addition of this association a major bump.
  - id: PoolServiceAccount
    description: Links an adapter pool to the service account its members authenticate with when they open the management connection to the pool hub. Not the identity work runs under — that comes from the borrower's own account, carried on each lease.
    inboundName: PoolServiceAccountOf
    inboundMultiplicity: N
    outboundName: PoolServiceAccount
    outboundMultiplicity: ZeroOrOne
