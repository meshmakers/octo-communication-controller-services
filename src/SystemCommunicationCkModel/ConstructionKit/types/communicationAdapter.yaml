$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: CommunicationAdapter
  derivedFromCkTypeId: System/Entity
  enableChangeStreamPreAndPostImages: true
  attributes:
  - id: System.Communication/LastSeen
    name: LastSeen
    isOptional: true
  - id: System.Communication/CommunicationState
    name: CommunicationState
  - id: System.Communication/ConfigurationState
    name: ConfigurationState
  - id: System.Communication/DeploymentState
    name: DeploymentState
  - id: System.Communication/AdapterType
    name: Type    
  - id: System.Communication/Deployment.ImageName
    name: ImageName
  - id: System.Communication/Deployment.ImageVersion
    name: ImageVersion
  - id: System/Name
    name: Name
  - id: System.Communication/AdapterConfiguration
    name: Configuration
    isOptional: true    
  associations:
  - id: System/ParentChild
    targetCkTypeId: System.Communication/CommunicationPool    
