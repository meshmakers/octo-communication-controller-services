$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: CommunicationAdapter
  derivedFromCkTypeId: System/Entity
  enableChangeStreamPreAndPostImages: true
  attributes:
  - id: ${thisModel}/LastSeen
    name: LastSeen
    isOptional: true
  - id: ${thisModel}/CommunicationState
    name: CommunicationState
  - id: ${thisModel}/ConfigurationState
    name: ConfigurationState
  - id: ${thisModel}/DeploymentState
    name: DeploymentState
  - id: ${thisModel}/AdapterType
    name: Type    
  - id: ${thisModel}/Deployment.ImageName
    name: ImageName
  - id: ${thisModel}/Deployment.ImageVersion
    name: ImageVersion
  - id: System/Name
    name: Name
  - id: ${thisModel}/AdapterConfiguration
    name: Configuration
    isOptional: true    
  associations:
  - id: System/ParentChild
    targetCkTypeId: ${thisModel}/CommunicationPool    
