$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
  - typeId: Pipeline
    description: A data processing pipeline that defines a sequence of processing nodes. Pipelines are deployed to adapters for execution and can be organized within data flows.
    derivedFromCkTypeId: ${this}/DeployableEntity
    attributes:
      - id: ${System}/Enabled
        name: Enabled
        isOptional: true
      - id: ${this}/PipelineDefinition
        name: PipelineDefinition
      - id: ${this}/IsDebuggingEnabled
        name: IsDebuggingEnabled
        isOptional: true
    associations:
      - id: ${System}/ParentChild
        targetCkTypeId: ${this}/DataFlow
      - id: ${this}/Executes
        targetCkTypeId: ${this}/Adapter
      - id: ${this}/Uses
        targetCkTypeId: ${System}/Configuration
      - id: ${this}/SendsDataTo
        targetCkTypeId: ${this}/Pipeline
