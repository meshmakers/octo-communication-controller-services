$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
  - typeId: LoxoneConfiguration
    derivedFromCkTypeId: ${System}/Configuration
    description: "Configuration for connecting to a Loxone Miniserver via REST API"
    isFinal: true
    attributes:
      - id: ${this}/Host
        name: Host
      - id: ${this}/Port
        name: Port
      - id: ${this}/Username
        name: Username
      - id: ${this}/Password
        name: Password
      - id: ${this}/IsSslEnabled
        name: IsSslEnabled
