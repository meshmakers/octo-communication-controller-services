$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
  - typeId: LoxoneConfiguration
    derivedFromCkTypeId: ${System}/Configuration
    description: "Configuration for connecting to a Loxone Miniserver via REST API"
    isFinal: true
    attributes:
      - id: ${this}/Host
        name: Host
      - id: ${this}/Port
        name: Port
      - id: ${this}/Username
        name: Username
      - id: ${this}/Password
        name: Password
        isOptional: true # AB#5528: a Secret is never seeded; "not set" is a valid state
      - id: ${this}/IsSslEnabled
        name: IsSslEnabled
      - id: ${this}/PollIntervalSeconds
        name: PollIntervalSeconds
        isOptional: true
      - id: ${this}/MappingTargets
        name: MappingTargets
        isOptional: true
