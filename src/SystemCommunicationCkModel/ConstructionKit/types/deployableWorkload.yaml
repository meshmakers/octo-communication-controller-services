$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: DeployableWorkload
  description: 'Abstract base type for workloads that the Communication Operator deploys to Kubernetes via Helm. Carries the chart reference, base values.yaml, and structured value overrides shared by Adapter and Application.'
  isAbstract: true
  derivedFromCkTypeId: ${this}/DeployableEntity
  attributes:
    - id: ${this}/ChartName
      name: ChartName
      isOptional: true
    - id: ${this}/ChartVersion
      name: ChartVersion
      isOptional: true
    - id: ${this}/ValuesYaml
      name: ValuesYaml
      isOptional: true
    - id: ${this}/Values
      name: Values
      isOptional: true
    - id: ${this}/ReceivesClusterSecrets
      name: ReceivesClusterSecrets
    - id: ${this}/IngressEnabled
      name: IngressEnabled
    - id: ${this}/Hostname
      name: Hostname
      isOptional: true
    - id: ${this}/LifecycleMode
      name: LifecycleMode
    - id: ${this}/IdleTimeoutMinutes
      name: IdleTimeoutMinutes
    - id: ${this}/LifecycleState
      name: LifecycleState
    - id: ${this}/LastActivityAt
      name: LastActivityAt
      isOptional: true
    - id: ${this}/OnDemandCapable
      name: OnDemandCapable
    - id: ${this}/OnDemandBlockingReasons
      name: OnDemandBlockingReasons
      isOptional: true
  associations:
    # Dedicated association role for the workload-to-Helm-repo link.
    # Reusing the generic "Uses" role would override the inverse usedBy view
    # on HelmRepositoryConfiguration (DeployableWorkload_UsedByUnionConnection
    # instead of Pipeline_UsedByUnionConnection), which makes the CK-engine
    # drop SystemConfigurationInterface from the generated schema for that
    # subtype. The dedicated role keeps both inverse views distinct.
    - id: ${this}/HelmRepository
      targetCkTypeId: ${this}/HelmRepositoryConfiguration
    # The pool a workload belongs to. Inherited by Adapter and Application,
    # so a Cloud pool deploys both kinds via the same association. Inbound
    # role name on Pool is "Manages" (Pool.Manages -> N workloads).
    - id: ${this}/Manages
      targetCkTypeId: ${this}/Pool
