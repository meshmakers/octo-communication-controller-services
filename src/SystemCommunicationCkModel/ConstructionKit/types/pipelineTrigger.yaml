$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
  - typeId: PipelineTrigger
    derivedFromCkTypeId: ${this}/DeployableEntity
    attributes:
      - id: ${System}/Enabled
        name: Enabled
      - id: ${System.Bot}/CronExpression
        name: CronExpression
    associations:
      - id: ${System}/ParentChild
        targetCkTypeId: ${this}/DataFlow
      - id: ${this}/Triggers
        targetCkTypeId: ${this}/Pipeline
