$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
  - typeId: PipelineTrigger
    description: A scheduled trigger that executes one or more pipelines based on a cron expression. Organized within data flows alongside the pipelines they trigger.
    derivedFromCkTypeId: ${this}/DeployableEntity
    attributes:
      - id: ${System}/Enabled
        name: Enabled
      - id: ${System.Bot}/CronExpression
        name: CronExpression
    associations:
      - id: ${System}/ParentChild
        targetCkTypeId: ${this}/DataFlow
      - id: ${this}/Triggers
        targetCkTypeId: ${this}/Pipeline
