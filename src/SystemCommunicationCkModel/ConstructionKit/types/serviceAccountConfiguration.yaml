$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
  - typeId: ServiceAccountConfiguration
    derivedFromCkTypeId: ${System}/Configuration
    description: "Client credentials for service-to-service authentication (OAuth2 client credentials grant)"
    isFinal: true
    attributes:
      - id: ${this}/IssuerUri
        name: IssuerUri
      - id: ${this}/ClientId
        name: ClientId
      - id: ${this}/ClientSecret
        name: ClientSecret
      - id: ${System}/TenantId
        name: TenantId
