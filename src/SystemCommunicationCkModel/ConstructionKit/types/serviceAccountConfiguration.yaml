$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
  - typeId: ServiceAccountConfiguration
    derivedFromCkTypeId: ${System}/Configuration
    description: "Client credentials for service-to-service authentication (OAuth2 client credentials grant)"
    isFinal: true
    # AB#5027 runtime-state audit of the four original attributes. Only ClientSecret is
    # marked (in attributes/finApiConfiguration.yaml, where the shared definition lives):
    #   * ClientSecret -> isRuntimeState: true. Issued by the identity provider at
    #     provisioning time; a blueprint can only seed a placeholder.
    #   * IssuerUri    -> deliberately NOT marked. It is per-environment *author*
    #     configuration: when the identity host moves (or a split-horizon issuer has to
    #     be corrected), a blueprint re-apply must be able to fix it. Marking it would
    #     freeze a wrong issuer on every existing tenant forever.
    #   * ClientId     -> deliberately NOT marked. Deterministic and seed-owned (derived
    #     from the well-known name); re-writing the same value on re-apply is a no-op.
    #     It is also the shared definition used by FinApi/MicrosoftGraph, where it is
    #     unambiguously author configuration.
    #   * TenantId     -> CANNOT be marked from this model: the attribute is
    #     ${System}/TenantId, owned by the System CK model in octo-construction-kit-engine,
    #     and shared by every type that uses it — flagging it there would change blueprint
    #     re-apply semantics platform-wide (the ClientSecret blast-radius problem, but
    #     across models).
    #
    # AB#5111 adds the declaration attributes AssignedRoleNames / AllowDelegation — author
    # configuration, see attributes/serviceAccountConfiguration.yaml. Both optional:
    # entities provisioned before 3.32.0 do not carry them, and their absence selects the
    # legacy behaviour (roles untouched, delegation grant present).
    #
    # AB#5115 / AB#5114 (3.33.0) make IssuerUri, TenantId and ClientSecret OPTIONAL, and an
    # absent/empty value now MEANS something:
    #   * IssuerUri empty  -> "the adapter's own installation": the mesh adapter resolves the
    #     issuer against its own identity/authority configuration (AB#5115). The reconcile
    #     writes new accounts with the attribute absent and converges the two historic
    #     spellings of "this installation" — the {{service.authority}} deploy-time token
    #     (case-insensitive, AB#5111) and the installation's concrete AuthorityUrl
    #     (trailing-slash-insensitive, pre-AB#5111) — to empty. Any OTHER concrete URL is a
    #     deliberate foreign identity target and is left alone.
    #   * TenantId empty   -> "the tenant the adapter runs for" (AB#5115). The reconcile
    #     converges a value equal to the current tenant to empty; a different value is a
    #     deliberate foreign target (paired with a foreign IssuerUri) and is left alone.
    #     This replaces the AB#5111 "always rewrite the current tenant id" behaviour.
    #   * ClientSecret empty (or an angle-bracket placeholder like <insert secret here>)
    #     -> "this account HAS no secret": the adapter acquires the account's tokens via the
    #     impersonation grant (urn:meshmakers:params:oauth:grant-type:impersonate) or the
    #     adapter-authenticated on-behalf-of extension (requested_client_id), presenting its
    #     OWN AB#5072 credentials — authorized by a System.Identity/MayActAs edge from the
    #     adapter's own client to this account's client, which the reconcile materialises
    #     (AB#5114). A non-empty usable secret keeps the classic client_credentials path
    #     byte-for-byte (dual-path transition).
    #
    # Loosening mandatory -> optional is a MINOR model change: every existing entity (all of
    # which carry all four values) stays valid, and no consumer contract narrows. The
    # isOptional flag lives on this type's attribute REFERENCES, so the shared attribute
    # definitions (ClientId/ClientSecret with FinApiConfiguration and
    # MicrosoftGraphConfiguration, ${System}/TenantId platform-wide) keep their mandatory
    # semantics on every other type — the blast radius is exactly this type.
    attributes:
      - id: ${this}/IssuerUri
        name: IssuerUri
        isOptional: true
      - id: ${this}/ClientId
        name: ClientId
      - id: ${this}/ClientSecret
        name: ClientSecret
        isOptional: true
      - id: ${System}/TenantId
        name: TenantId
        isOptional: true
      - id: ${this}/AssignedRoleNames
        name: AssignedRoleNames
        isOptional: true
      - id: ${this}/AllowDelegation
        name: AllowDelegation
        isOptional: true
