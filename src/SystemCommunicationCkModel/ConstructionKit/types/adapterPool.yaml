$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
# AB#4924 §4a — a pool of interchangeable adapter processes, owned by ONE tenant and leased
# out to tenants in its subtree one work item at a time.
#
# 🔴 Naming: this is the type the word "pool" now means in System.Communication. The old
# type called `Pool` was a deployment LOCATION and was renamed to DeploymentSite in the same
# 4.0.0 bump precisely so the two never coexist under one name (concept §8, Q16 + Q18).
#
# 🔴 An AdapterPool is ONE workload with a replica range, not N Adapter entities.
#
# Concept §4a says "members are ordinary adapter workloads with LifecycleMode = Leased",
# which cannot be right as written: §2 defines Leased as the mode of an adapter that has NO
# process of its own, i.e. the BORROWER. A member is the opposite — it is the process. The
# model resolves this by making the pool itself a DeployableWorkload whose members are
# replicas of it, so:
#   - members need no Adapter entity, no author configuration and no lifecycle of their own;
#   - MinReplicas / MaxReplicas are a replica range of one Helm release, which is what the
#     operator's one-workload-one-release model already supports;
#   - Leased stays unambiguously the borrower's mode, set on Adapter.
# The only operator assumption that still has to break is the one §4b actually names: one
# workload per TENANT NAMESPACE, because members run in a platform namespace with the
# lending tenant as owner reference so that consumption is billed to the tenant whose work
# ran, not to the lender.
#
# The pool — not the AB#4918 idle watchdog — owns its members' lifecycle. The watchdog
# drains a workload based on ITS OWN pipelines' LastExecutionAt, and a pool has no pipelines
# of its own: every pipeline it runs belongs to a borrower in a different tenant database.
# MinReplicas and IdleTimeoutMinutes (inherited from DeployableWorkload) are what drain a
# member instead.
- typeId: AdapterPool
  derivable: Any
  description: 'A pool of interchangeable adapter processes owned by one tenant and leased to tenants in its subtree, one work item per lease (AB#4924). The pool declares how many members may exist (MinReplicas..MaxReplicas), how big each member is, what queue pressure starts another one, and which tenants may borrow. Members are replicas of this one workload rather than separate entities: a lease binds a member to a tenant for the duration of one work item and the member retains nothing tenant-scoped afterwards. Not to be confused with DeploymentSite, which is where a workload is deployed and which was itself called Pool before 4.0.0.'
  derivedFromCkTypeId: ${this}/DeployableWorkload
  isFinal: true
  attributes:
    # Size and shape of the pool.
    - id: ${this}/MinReplicas
      name: MinReplicas
    - id: ${this}/MaxReplicas
      name: MaxReplicas
    - id: ${this}/PoolMemberCpuRequest
      name: PoolMemberCpuRequest
      isOptional: true
    - id: ${this}/PoolMemberCpuLimit
      name: PoolMemberCpuLimit
      isOptional: true
    - id: ${this}/PoolMemberMemoryRequest
      name: PoolMemberMemoryRequest
      isOptional: true
    - id: ${this}/PoolMemberMemoryLimit
      name: PoolMemberMemoryLimit
      isOptional: true
    - id: ${this}/PoolScaleUpPolicy
      name: ScaleUpPolicy
    - id: ${this}/ScaleUpQueueDepthThreshold
      name: ScaleUpQueueDepthThreshold
    - id: ${this}/ScaleUpQueueWaitSeconds
      name: ScaleUpQueueWaitSeconds
    # Lending scope — who may borrow a member. Moved here off Adapter: lending is a
    # property of the thing that owns processes. See attributes/adapterLeasing.yaml.
    - id: ${this}/AdapterSharingMode
      name: SharingMode
    - id: ${this}/LendingAllowedTenantIds
      name: LendingAllowedTenantIds
      isOptional: true
    - id: ${this}/LendingMaxConcurrentLeasesPerTenant
      name: LendingMaxConcurrentLeasesPerTenant
      isOptional: true
  associations:
    # The identity a member presents when it opens its MANAGEMENT connection to
    # /adapterPoolHub. It is NOT the identity work executes under: each lease carries the
    # BORROWER's own PipelineServiceAccount credential (concept §4, Q6), TTL-scoped and
    # never persisted by the member, so the member acts exactly as the borrower's own
    # adapter would and no standing grant is created in any borrower tenant.
    #
    # 🔴 A DEDICATED role, deliberately not the existing PipelineServiceAccount role. Adding
    # a second origin type to that role changes the inverse union view on
    # ServiceAccountConfiguration, and the CK engine then drops SystemConfigurationInterface
    # from the generated GraphQL schema for every Configuration subtype — the exact failure
    # already documented on the HelmRepository link in types/deployableWorkload.yaml and on
    # the PipelineServiceAccount role itself.
    - id: ${this}/PoolServiceAccount
      targetCkTypeId: ${this}/ServiceAccountConfiguration
  # AB#8595 (4.17.0, Feature AB#5697 F4.3): the pool operations of the REST API as CK methods, handled by the
  # communication controller. REST unchanged; roles as on Adapter (see types/adapter.yaml).
  methods:
    - methodId: RefreshMirrors-1
      kind: Static
      description: "Reconciles the LentAdapterPool mirrors of the calling tenant (the borrower) against what its ancestors and siblings lend it (REST POST AdapterPool/mirrors/refresh)."
      result:
        valueType: Record
        valueCkRecordId: ${this}/AdapterPoolMirrorSyncResult
      authorization:
        roles: [ CommunicationManagement ]
      execution:
        timeoutSeconds: 120
        idempotent: true
    - methodId: PublishMirrors-1
      kind: Static
      description: "Pushes the adapter pools of the calling tenant (the lender) out to every tenant that may borrow from them (REST POST AdapterPool/mirrors/publish)."
      result:
        valueType: Record
        valueCkRecordId: ${this}/AdapterPoolMirrorSyncResult
      authorization:
        roles: [ CommunicationManagement ]
      execution:
        timeoutSeconds: 120
        idempotent: true
    - methodId: GrantLease-1
      description: "Grants a lease on a member of this pool to a borrowing tenant (REST POST AdapterPool/{adapterPoolRtId}/lease; a test and diagnostic surface, production leasing is the scheduler's). A refused lease is a normal result with granted false and a status message."
      parameters:
        - { name: borrowerTenantId, valueType: String, description: "The borrowing tenant; it must be in the lending scope of the pool." }
        - { name: adapterRtId, valueType: String, description: "RtId (24 hexadecimal characters) of the Leased adapter in the borrowing tenant." }
        - { name: executionId, valueType: String, isOptional: true, description: "The queued execution the lease is for." }
        - { name: ttlSeconds, valueType: Int, isOptional: true, description: "Lease lifetime in seconds (1-3600); without it the default applies." }
      result:
        valueType: Record
        valueCkRecordId: ${this}/AdapterPoolLeaseResult
      authorization:
        roles: [ CommunicationManagement ]
      execution:
        timeoutSeconds: 30
        idempotent: false
    - methodId: CancelQueuedExecution-1
      description: "Cancels one execution that is still waiting in the queue of this pool for a lease (REST DELETE AdapterPool/{adapterPoolRtId}/queue/{executionId}). It never interrupts a running pipeline."
      parameters:
        - { name: executionId, valueType: String, description: "The queued execution to cancel." }
      errors:
        - { code: EXECUTION_ALREADY_LEASED, description: "The execution already holds a lease; cancelling it would interrupt a running pipeline, which is a different operation." }
        - { code: QUEUED_EXECUTION_NOT_FOUND, description: "No queued execution with this id belongs to the pool." }
      authorization:
        roles: [ CommunicationManagement ]
      execution:
        timeoutSeconds: 15
        idempotent: false
