$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
# AB#4924 — renamed from `Pool` in System.Communication 4.0.0. The type never was a pool of
# anything: it is the LOCATION a workload is deployed to ("Default Cloud",
# "k8sfirmianstrasse"), and the operator that serves that location registers against it.
# The name was actively misleading once AB#4924 introduced a real pool of adapter processes
# (see types/adapterPool.yaml) — two unrelated concepts called "Pool" in one model is the
# kind of ambiguity that gets read wrong during an incident, so the rename ships WITH the
# feature that would otherwise collide with it, as one major bump and one migration rather
# than two (concept §8, Q16 + Q18).
#
# The association role linking a workload to its site was renamed in the same bump:
# `Manages` / `ManagedBy` -> `Hosts` / `HostedBy` (associations/hosts.yaml). Both halves move
# together so the estate takes one migration instead of two (concept §8, Q18).
- typeId: DeploymentSite
  description: A deployment location that the Communication Operator serves — a cloud environment or a named edge site. Workloads are assigned to a site via the Hosts role, and the operator responsible for the site registers via SignalR to deploy and monitor them. Renamed from `Pool` in 4.0.0; the old name described a grouping the type never had and collided with the adapter pool introduced by AB#4924.
  derivedFromCkTypeId: ${this}/DeployableEntity
  isFinal: true
  attributes:
  - id: ${this}/CommunicationStateTimestamp
    name: CommunicationStateTimestamp
    isOptional: true
  - id: ${this}/CommunicationState
    name: CommunicationState
  - id: ${this}/ConfigurationState
    name: ConfigurationState
  - id: ${this}/LastConfigurationError
    name: LastConfigurationError
    isOptional: true
  - id: ${this}/LastConfigurationErrorTimestamp
    name: LastConfigurationErrorTimestamp
    isOptional: true
  - id: ${this}/Environment
    name: Environment
