$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
# AB#4924 — renamed from `Pool` in System.Communication 4.0.0. The type never was a pool of
# anything: it is the LOCATION a workload is deployed to ("Default Cloud",
# "k8sfirmianstrasse"), and the operator that serves that location registers against it.
# The name was actively misleading once AB#4924 introduced a real pool of adapter processes
# (see types/adapterPool.yaml) — two unrelated concepts called "Pool" in one model is the
# kind of ambiguity that gets read wrong during an incident, so the rename ships WITH the
# feature that would otherwise collide with it, as one major bump and one migration rather
# than two (concept §8, Q16 + Q18).
#
# The association role linking a workload to its site was renamed in the same bump:
# `Manages` / `ManagedBy` -> `Hosts` / `HostedBy` (associations/hosts.yaml). Both halves move
# together so the estate takes one migration instead of two (concept §8, Q18).
- typeId: DeploymentSite
  derivable: Any
  description: A deployment location that the Communication Operator serves — a cloud environment or a named edge site. Workloads are assigned to a site via the Hosts role, and the operator responsible for the site registers via SignalR to deploy and monitor them. Renamed from `Pool` in 4.0.0; the old name described a grouping the type never had and collided with the adapter pool introduced by AB#4924.
  derivedFromCkTypeId: ${this}/DeployableEntity
  isFinal: true
  attributes:
  - id: ${this}/CommunicationStateTimestamp
    name: CommunicationStateTimestamp
    isOptional: true
  - id: ${this}/CommunicationState
    name: CommunicationState
  - id: ${this}/ConfigurationState
    name: ConfigurationState
  - id: ${this}/LastConfigurationError
    name: LastConfigurationError
    isOptional: true
  - id: ${this}/LastConfigurationErrorTimestamp
    name: LastConfigurationErrorTimestamp
    isOptional: true
  - id: ${this}/Environment
    name: Environment

  # AB#9050 (4.19.0, Feature AB#5701 F5.3): deploy and undeploy of the REST DeploymentSiteController as CK methods, handled by
  # the communication controller (handler: service). Roles as on Adapter (types/adapter.yaml). The call returns once the
  # operator was told and the state was written; the operator provisions or removes the site afterwards and reports it in
  # DeploymentState. Waiting for that report would exceed the accept bound, so both are candidates for execution.mode async
  # once F3.6 (AB#5694) is available (a Major per method, Deploy-2).
  methods:
  - methodId: Deploy-1
    description: "Deploys the deployment site (REST POST DeploymentSite/deploy?deploymentSiteRtId=): a Cloud site asks the central Communication Operator to provision the site (DeploymentSite CR, broker secret) and is set Deployed. An Edge site is refused. Workloads are not deployed; deploy them one by one afterwards."
    errors:
    - { code: COMMUNICATION_DISABLED, description: "Communication is disabled for the tenant; enable it first (REST 409). Nothing was changed." }
    - { code: DEPLOYMENT_SITE_DEPLOY_FAILED, description: "The deployment site could not be deployed, e.g. it is an Edge site. Parameter message names the cause." }
    authorization:
      roles: [ CommunicationManagement ]
    execution:
      timeoutSeconds: 60
      idempotent: true
  - methodId: Undeploy-1
    description: "Undeploys the deployment site (REST POST DeploymentSite/undeploy?deploymentSiteRtId=): uninstalls every workload it hosts, asks the operator to remove the site and sets it Undeployed (Edge: Disabled). Allowed while Communication is disabled, so remediation always works."
    errors:
    - { code: DEPLOYMENT_SITE_UNDEPLOY_FAILED, description: "The deployment site could not be undeployed, e.g. it is not deployed. Parameter message names the cause." }
    authorization:
      roles: [ CommunicationManagement ]
    execution:
      timeoutSeconds: 120
      # a second call after a successful one answers DEPLOYMENT_SITE_UNDEPLOY_FAILED (not deployed): not safe to repeat blindly
      idempotent: false
