$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: Adapter
  description: An external client that connects via SignalR to execute data pipelines. Adapters manage pools and receive pipeline configurations from the Communication Controller. Deployed to Kubernetes by the Communication Operator via Helm (chart/values inherited from DeployableWorkload).
  derivedFromCkTypeId: ${this}/DeployableWorkload
  attributes:
    - id: ${this}/CommunicationStateTimestamp
      name: CommunicationStateTimestamp
      isOptional: true
    - id: ${this}/CommunicationState
      name: CommunicationState
    - id: ${this}/ConfigurationState
      name: ConfigurationState
    - id: ${this}/LastConfigurationError
      name: LastConfigurationError
      isOptional: true
    - id: ${this}/LastConfigurationErrorTimestamp
      name: LastConfigurationErrorTimestamp
      isOptional: true
    - id: ${this}/AdapterConfiguration
      name: Configuration
      isOptional: true
    - id: ${this}/LastSyncedSequenceNumber
      name: LastSyncedSequenceNumber
  # Manages → Pool moved up to DeployableWorkload, so Application inherits the
  # same association. Existing runtime entities of type Adapter retain their
  # Manages relations because the association role id is unchanged.
