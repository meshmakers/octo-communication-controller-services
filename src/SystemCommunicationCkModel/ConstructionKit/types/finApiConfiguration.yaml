$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
  - typeId: FinApiConfiguration
    derivedFromCkTypeId: ${System}/Configuration
    isFinal: true
    description: "Configuration for the finAPI banking adapter connection."
    attributes:
      - id: ${this}/Host
        name: BaseUrl
      - id: ${this}/ClientId
        name: ClientId
      - id: ${this}/ClientSecret
        name: ClientSecret
        isOptional: true # AB#5528: a Secret is never seeded; "not set" is a valid state
      - id: ${this}/Username
        name: Username
      - id: ${this}/Password
        name: Password
        isOptional: true # AB#5528: a Secret is never seeded; "not set" is a valid state
      - id: ${this}/IsSandbox
        name: IsSandbox
        isOptional: true
