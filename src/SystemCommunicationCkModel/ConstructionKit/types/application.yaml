$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: Application
  description: 'A tenant-specific web application deployed by the Communication Operator via Helm. Examples: energy-community, voest-app, maco-app. Most configuration (URIs, env vars, secrets) lives in ValuesYaml / Values inherited from DeployableWorkload; only operator-relevant fields are exposed as typed attributes. Ingress (IngressEnabled + Hostname) is inherited from DeployableWorkload.'
  derivedFromCkTypeId: ${this}/DeployableWorkload
  isFinal: true
