$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: DeployableEntity
  description: Abstract base type for entities that can be deployed to adapters or pools. Tracks deployment state, name, description, and status messages.
  isAbstract: true
  derivedFromCkTypeId: ${System}/Entity
  attributes:
  - id: ${this}/DeploymentState
    name: DeploymentState
  - id: ${System}/Name
    name: Name
    isOptional: true
  - id: ${System}/Description
    name: Description
    isOptional: true
  - id: ${this}/StatusMessage
    name: StatusMessage
    isOptional: true
  - id: ${this}/LastDeploymentError
    name: LastDeploymentError
    isOptional: true
  - id: ${this}/LastDeploymentErrorTimestamp
    name: LastDeploymentErrorTimestamp
    isOptional: true