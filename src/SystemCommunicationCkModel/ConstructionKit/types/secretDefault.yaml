$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
# AB#7243 — the platform-owned place in a served tenant that receives a secret default an
# Application declares (attribute SecretDefaults, record SecretDefaultProjection).
#
# 🔴 PROVISIONED BY THE CONTROLLER, NEVER AUTHOR-SET. The controller creates, updates and deletes
# these entities from the Application's declaration. A tenant edit is overwritten on the next
# reconcile, and a tenant must not create one by hand. Name is the key and the well-known name the
# controller sets.
#
# 🔴 PLATFORM-ONLY. The Value may be used only inside platform building blocks that return the
# result and never the value. No tenant pipeline, user or role may reveal it, tenant admins
# included: it must not be readable through GraphQL, REST, MCP, export, debug points or logs, and
# no RevealSecret path may accept it. The tenant's own secret of the same purpose is a separate
# attribute and is never touched by this entity.
#
# 🔴 NOT A CONFIGURATION TYPE. It derives from System/Entity, never from a Configuration type: the
# controller ships Configuration entities, secrets revealed, to adapters as pipeline configuration,
# so deriving from one would hand the value to every pipeline of the tenant.
#
# Only Value is a Secret; every other attribute is runtime state (see attributes/secretDefault.yaml).
- typeId: SecretDefault
  description: 'A platform-owned secret default in a served tenant (AB#7243). Provisioned by the Communication Controller from the SecretDefaults of an Application; never author-set, a tenant edit is overwritten on the next reconcile. Value is platform-only: no tenant pipeline, user or role (tenant admins included) may reveal it, and its existence is not meant to be shown to the tenant as a secret to read. Not a Configuration type, so it is never shipped to adapters as pipeline configuration.'
  derivedFromCkTypeId: ${System}/Entity
  isFinal: true
  attributes:
    - id: ${System}/Name
      name: Name
    - id: ${this}/SecretDefaultValue
      name: Value
    - id: ${this}/SecretDefaultSourceTenantId
      name: SourceTenantId
    - id: ${this}/SecretDefaultSourceWorkloadRtId
      name: SourceWorkloadRtId
    - id: ${this}/SecretDefaultLastProjectedAt
      name: LastProjectedAt
      isOptional: true
