$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
records:
  # AB#7243 — one secret default an Application declares (attribute SecretDefaults).
  #
  # 🔴 There is deliberately NO scope field. The target set is fixed: the Application's own tenant
  # plus its whole subtree (children and every indirect descendant, no siblings). AllowedTenantIds
  # can only NARROW that set; a tenant outside it is ignored, never granted.
  - recordId: SecretDefaultProjection
    description: 'A secret default declared on an Application (AB#7243). Key names the platform-owned SecretDefault that receives it in every target tenant; SecretValue is the value (a Secret, write-only); AllowedTenantIds optionally narrows the target tenants, never widens them; Description says what it is for. The target set is always the Application''s own tenant plus its whole subtree.'
    isFinal: true
    isAbstract: false
    recordKey: Key
    attributes:
      - id: ${this}/SecretDefaultKey
        name: Key
      - id: ${this}/SecretDefaultValue
        name: SecretValue
      - id: ${this}/SecretDefaultAllowedTenantIds
        name: AllowedTenantIds
        isOptional: true
      - id: ${this}/SecretDefaultDescription
        name: Description
        isOptional: true
