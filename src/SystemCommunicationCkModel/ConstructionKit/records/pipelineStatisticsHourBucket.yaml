$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
records:
  - recordId: PipelineStatisticsHourBucket
    description: One UTC clock hour of pipeline-execution aggregates (AB#4370, AB#5583). Executions older than the retention window are folded into these buckets and then physically deleted; hours that still have retained executions are recomputed from them on every statistics sweep, so the buckets always cover every counted execution.
    isFinal: true
    isAbstract: false
    attributes:
      - id: ${this}/HourStartAt
        name: HourStartAt
      - id: ${this}/SuccessCount
        name: SuccessCount
      - id: ${this}/FailureCount
        name: FailureCount
      - id: ${this}/TotalDurationMs
        name: TotalDurationMs
      - id: ${this}/DurationCount
        name: DurationCount
