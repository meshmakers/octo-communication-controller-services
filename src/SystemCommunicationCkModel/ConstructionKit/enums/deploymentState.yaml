$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
enums:
- enumId: DeploymentState
  description: 'Tracks whether a deployable entity (adapter, application, pipeline, pool, or trigger) is currently deployed and active. Disabled means the entity cannot be deployed at all: Edge pools (no central operator CR), workloads missing Helm chart/version/repository, or pipelines/triggers whose adapter is Disabled. Deploy/Undeploy actions are rejected on Disabled entities.'
  useFlags: false
  values:
  - key: 0
    name: Undeployed
  - key: 1
    name: Pending
  - key: 2
    name: Deployed
  - key: 3
    name: Error
  - key: 4
    name: Disabled
   