$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
enums:
- enumId: DeploymentState
  description: Tracks whether a deployable entity (adapter, pipeline, pool, or trigger) is currently deployed and active.
  useFlags: false
  values:
  - key: 0
    name: Undeployed
  - key: 1
    name: Pending
  - key: 2
    name: Deployed
  - key: 3
    name: Error
   