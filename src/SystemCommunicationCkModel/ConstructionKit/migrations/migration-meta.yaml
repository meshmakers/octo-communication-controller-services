$schema: https://schemas.meshmakers.cloud/ck-migration-meta.schema.json
# AB#4924: the history now reaches 4.0.0, so this id moves with it. Between 3.1.1 and
# 3.35.0 every bump was additive and rode the engine's schema-only bridge, which is why
# this file sat at 3.1.1 while the model was already at 3.35.0 ("schema-ahead-of-history").
# 4.0.0 renames a type, so it needs a real script and the history catches up.
#
# 🔴 4.0.1 (AB#5271) deliberately adds NO entry, and this id deliberately stays at 4.0.0.
# That is the documented "schema-ahead-of-history" state above, not an oversight: the history
# names the last version that needed a script. 4.0.1 adds the LentAdapterPool type and the
# LentFrom association and REMOVES Adapter.LentFromTenantId / .LentFromAdapterPoolRtId — and the
# removal is precisely what cannot be scripted. The association's target is a mirror the
# Communication Controller provisions at run time, so its RtId does not exist while a migration
# runs; there is nothing to convert the two orphaned strings into. The relationship is
# re-established by the mirror sync plus a re-link of the adapter, and a tenant on 4.0.0 rides the
# post-chain schema-only bridge, leaving the two values as dead data. Verified on a local tenant
# that was carrying 4.0.0.
#
# ✅ Both halves of that sentence now exist (AB#5349). The mirror sync provisions the mirror, and
# AdapterPoolMirrorProvisioningService.RelinkLeasedAdaptersAsync re-links the adapter: it reads the
# two dead values off the adapter (GetAttributeValueOrDefault — the model no longer declares them,
# and the stored key is `lentFromPoolRtId`, NOT `lentFromAdapterPoolRtId`) and writes the LentFrom
# edge when they name a mirror the same run just decided is lent here. It never invents an edge, and
# it deliberately does NOT delete the two values: they are the only remaining evidence of what the
# adapter borrowed. See CLAUDE.md and docs/concepts/lent-adapter-pool-mirror.md §7.6.
#
# 4.1.0 (AB#5295) adds NO entry either: one enum (HelmRepositoryPurpose) and one optional
# attribute (HelmRepositoryConfiguration.Purpose), both additive — rides the schema-only bridge.
#
# 4.2.0 (AB#5279) adds NO entry either: seven optional runtime-state attributes on
# PipelineExecution (the invoker of a queued work item), purely additive — rides the
# schema-only bridge.
#
# 4.3.0 (AB#5301) adds NO entry either: LifecycleMode and IdleTimeoutMinutes become
# isRuntimeState (minor per ck-semver-rules "isRuntimeState changed"); no stored value
# changes, only what a blueprint re-apply may overwrite — rides the schema-only bridge.
#
# 4.6.0 (AB#5803, cutover W1) adds NO entry either: it carries main's System.Communication 3.41.0
# content into the 4.x line — DeployableEntity.LastSuccessfulStatusAt / .ConsecutiveStatusFailures
# (AB#5618) and PipelineStatistics.FoldedBefore (AB#5583), all optional isRuntimeState attributes,
# plus description-only changes. Purely additive within 4.x — rides the schema-only bridge from any
# 4.x below it. The 3.41.0 entry point further down is what carries a MAIN tenant's values for those
# three attributes across the major: ChangeCkType keeps every stored attribute value, and 4.6.0 is
# the first 4.x that declares them.
ckModelId: System.Communication-4.0.0
migrations:
  - fromVersion: "3.0.1"
    toVersion: "3.0.2"
    scriptPath: 3.0.1-to-3.0.2.yaml
    description: "Rename DataPipeline to DataFlow for tenants already at 3.0.1 without migration"
    breaking: true
  - fromVersion: "3.0.2"
    toVersion: "3.0.3"
    scriptPath: 3.0.2-to-3.0.3.yaml
    description: "Rename DataPipeline to DataFlow for tenants where previous migration failed"
    breaking: true
  - fromVersion: "3.0.3"
    toVersion: "3.1.0"
    scriptPath: 3.0.3-to-3.1.0.yaml
    description: "Merge EdgeAdapter/MeshAdapter into Adapter, EdgePipeline/MeshPipeline into Pipeline"
    breaking: true
  - fromVersion: "3.1.0"
    toVersion: "3.1.1"
    scriptPath: 3.1.0-to-3.1.1.yaml
    description: "Merge EdgeAdapter/MeshAdapter into Adapter, EdgePipeline/MeshPipeline into Pipeline (retry after engine fix)"
    breaking: true
  # AB#4924 — Pool -> DeploymentSite.
  #
  # 🔴 Why the entry point is 3.35.0 and not 3.1.1, i.e. why this does not simply extend the
  # chain above. CkModelMigrationService.FindBridgedMigrationPathAsync collects candidate
  # entry points as "every fromVersion GREATER than the version the tenant has installed"
  # and then bridges the start gap with a no-op. A tenant on any 3.x below 3.35.0 therefore
  # bridges straight to 3.35.0 and runs this script; it does NOT get dragged back through
  # the 3.0.x DataFlow renames. Hanging the entry off 3.1.1 instead would make every modern
  # tenant replay four obsolete scripts to reach it.
  - fromVersion: "3.35.0"
    toVersion: "4.0.0"
    scriptPath: 3.35.0-to-4.0.0.yaml
    description: "Rename CK type Pool to DeploymentSite (AB#4924)"
    breaking: true
  # 🔴 Defensive duplicate entry for 3.36.0, and it is NOT redundant.
  #
  # 3.36.0 was the first cut of this work and was published into dev/.octo/local-catalog
  # before the design moved to a major bump. It is not on any cluster, but any local dev
  # tenant that installed it sits ABOVE every fromVersion in the chain — and for such a
  # tenant the bridging logic finds no candidate entry point at all and falls through to
  # CkModelMigrationService's final "post-chain schema-only bridge", which upgrades the
  # schema and SKIPS THE RENAME SILENTLY. The tenant would then hold Pool entities of a
  # type the model no longer defines, with no error anywhere.
  #
  # This is the same class of failure as the frozen CK dependency pin behind AB#4696 /
  # AB#4999 / AB#5196: a version that resolves correctly right up to the moment it does not,
  # and reports nothing when it does not. The script is idempotent (the Transform matches no
  # entities once the rename has happened, and the post-validation then passes trivially),
  # so a second entry pointing at the same script costs nothing and closes the hole.
  #
  # Delete this entry only once no environment can be at 3.36.0 any more (E8: not before the prod
  # migration). NOTE: 3.36.0 is ALSO a real main release (AB#5309, published 2026-09-22) — a second
  # reason the entry stays.
  - fromVersion: "3.36.0"
    toVersion: "4.0.0"
    scriptPath: 3.35.0-to-4.0.0.yaml
    description: "Rename CK type Pool to DeploymentSite (AB#4924) — entry point for tenants that installed the withdrawn 3.36.0"
    breaking: true

  # 🔴 AB#4924 / G3 — one entry for EVERY System.Communication 3.x at or above 3.35.0 that main has
  # released (or announced) since this major was cut, all pointing at the same script.
  #
  # Why each version needs its own line: the engine finds the 4.x data migration only through an
  # entry point AT or ABOVE the installed version (start-gap bridge) or exactly AT it (partial path).
  # A tenant above the highest fromVersion has no path at all. Before this block the highest entry
  # was 3.36.0, so every main tenant on 3.37.0 … 3.40.0 (test-2, staging, prod) would have ridden
  # the post-chain schema-only bridge to 4.x: no Pool -> DeploymentSite, no Manages -> Hosts, no
  # well-known-name rename, no post-validation — and no error. The CK engine now refuses that bridge
  # across a major (CkMigrationMajorVersionGuard), so a version missing here fails LOUDLY instead —
  # but it still fails. Whoever bumps System.Communication 3.x on main before 0.2 lands there must
  # add the new version here too.
  #
  # Content check (3.36.0 … 3.41.0 vs 4.6.0, re-checked 2026-10-08 against the PUBLISHED 3.41.0 from
  # construction-kit-libraries-build): Pool, the Manages role and the CommunicationPool well-known name
  # are unchanged in every 3.x listed, so the one script is right for all of them. Everything 3.37–3.40
  # added on main (tenant-owned billing markers, McpServerUrl runtime state, System 2.5 repin) is
  # already in 4.5.0 via the main merge. 3.41.0 (AB#5618 deployable status history + AB#5583 fold
  # boundary, NO SECRET) adds three optional runtime-state attributes — LastSuccessfulStatusAt,
  # ConsecutiveStatusFailures, FoldedBefore — which 4.6.0 is the first 4.x to declare. A 3.41.0 tenant
  # must therefore only meet 4.6.0 or later; on 4.5.0 the stored values would survive but be invisible
  # to the model (SystemCommunication4MigrationTests pins that they come through on 4.6.0).
  #
  # 🔴 Deliberately NO entry for 3.42.0. Phase 3 (decisions 2026-10-08) makes 3.42.0 on main the
  # SECRET switch (AB#5537: credentials as valueType Secret, encrypted values) — its 4.x counterpart is
  # 4.7.0. An entry here would let a 3.42.0 tenant run the rename onto 4.6.0 and keep its `enc:` values
  # under attributes 4.6.0 declares as plain strings: wrong, and silent. Without the entry the CK
  # engine's major-version guard (CkMigrationMajorVersionGuard) REFUSES 3.42.0 -> 4.6.0 loudly and the
  # history stays on 3.42.0. Add the 3.42.0 entry together with 4.7.0 (the SECRET line), after checking
  # the then-published 3.42.0 against it. (A 3.42.0 that exists today only on local tenants — the
  # superseded AB#5618-only cut — is refused too; such a tenant is local and can be rebuilt.)
  #
  # The script is idempotent (see the 3.36.0 entry), so duplicates cost nothing. Keep all of them
  # until no environment can be on 3.x any more (E8).
  - fromVersion: "3.37.0"
    toVersion: "4.0.0"
    scriptPath: 3.35.0-to-4.0.0.yaml
    description: "Rename CK type Pool to DeploymentSite (AB#4924) — entry point for 3.37.0 (main AB#5432 (System 2.3.0 cascade), published)"
    breaking: true
  - fromVersion: "3.37.1"
    toVersion: "4.0.0"
    scriptPath: 3.35.0-to-4.0.0.yaml
    description: "Rename CK type Pool to DeploymentSite (AB#4924) — entry point for 3.37.1 (main AB#5495 (McpServerUrl runtime state), superseded by 3.38.0, never in the private catalog — local tenants only)"
    breaking: true
  - fromVersion: "3.38.0"
    toVersion: "4.0.0"
    scriptPath: 3.35.0-to-4.0.0.yaml
    description: "Rename CK type Pool to DeploymentSite (AB#4924) — entry point for 3.38.0 (main AB#5495 (isRuntimeState flip as minor), published)"
    breaking: true
  - fromVersion: "3.39.0"
    toVersion: "4.0.0"
    scriptPath: 3.35.0-to-4.0.0.yaml
    description: "Rename CK type Pool to DeploymentSite (AB#4924) — entry point for 3.39.0 (main AB#5359 (tenant-owned billing markers), published)"
    breaking: true
  - fromVersion: "3.39.1"
    toVersion: "4.0.0"
    scriptPath: 3.35.0-to-4.0.0.yaml
    description: "Rename CK type Pool to DeploymentSite (AB#4924) — entry point for 3.39.1 (main AB#5528 (System 2.5 repin), superseded by 3.40.0, never in the private catalog — local tenants only)"
    breaking: true
  - fromVersion: "3.40.0"
    toVersion: "4.0.0"
    scriptPath: 3.35.0-to-4.0.0.yaml
    description: "Rename CK type Pool to DeploymentSite (AB#4924) — entry point for 3.40.0 (main AB#5528 (System 2.5 repin), published; test-2/staging/prod main tenants)"
    breaking: true
  - fromVersion: "3.41.0"
    toVersion: "4.0.0"
    scriptPath: 3.35.0-to-4.0.0.yaml
    description: "Rename CK type Pool to DeploymentSite (AB#4924) — entry point for 3.41.0 (main AB#5618 deployable status history + AB#5583 fold boundary, no SECRET; published 2026-10-08). Needs 4.6.0+ to see LastSuccessfulStatusAt/ConsecutiveStatusFailures/FoldedBefore"
    breaking: true
