$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
# Shared adapter leasing (AB#4924) — see docs/concepts/shared-adapter-leasing.md and the
# increment plan next to it.
#
# THREE parties, and keeping them apart is the whole point of this file:
#
#   POOL     (AdapterPool, in the LENDING tenant) — owns the processes and declares WHO may
#            borrow them: AdapterSharingMode + LendingAllowedTenantIds +
#            LendingMaxConcurrentLeasesPerTenant, plus the sizing in attributes/adapterPool.yaml.
#   BORROWER (Adapter, in the borrowing tenant) — has NO process of its own:
#            LifecycleMode = Leased + a LentFrom edge to a LentAdapterPool mirror (AB#5271).
#   EXECUTION(PipelineExecution, in the BORROWING tenant) — records which pool and which
#            member actually served it: LeasedFromTenantId + LeasedFromPoolRtId +
#            LeasedOnMemberId, alongside QueuedAt / LeaseGrantedAt / LeaseReleasedAt.
#
# 🔴 EVERY cross-party reference here is a plain value, never an association, and it has to
# be. A CK association resolves inside ONE tenant database. The pool lives in the lending
# tenant's database and both the borrowing Adapter and its PipelineExecution live in the
# borrower's, so there is no database in which such an edge could exist. The controller is
# the only component that sees both tenants, so it is the only component that can resolve
# these — and nothing enforces that a target still exists. A deleted or no-longer-lending
# pool is detected at LEASE time, not at write time (concept §6, "Parent tenant deleted
# while lending" → the borrower falls back to Deployed=false with a blocking reason).
#
# This applies to concept §5's "an association from the execution to the assigned member"
# as well: the execution is the borrower's entity and the member is the lender's, so that
# sentence describes an edge the engine cannot store. LeasedOnMemberId carries it instead.
#
# AB#5187 ownership classification, and it splits cleanly:
#   isRuntimeState: false — the lending scope and the borrowing declaration. Both are
#     deliberate statements about a tenant tree, and concept §8 Q9 decided them to be author
#     configuration so a blueprint can seed BOTH halves: a parent tenant's blueprint declares
#     the pool and its range, a child tenant's declares that it borrows. (LifecycleMode /
#     IdleTimeoutMinutes in attributes/helmDeployment.yaml, once cited here as the same
#     kind, became runtime state with AB#5301 — a re-apply must not undo an operator's
#     OnDemand. The scope and the borrowing edge stay seed-owned: nothing operational
#     rewrites them at run time.)
#   isRuntimeState: true — everything written by a running lease. None of it is seedable and
#     a blueprint re-apply must never touch it.
attributes:

# ---------------------------------------------------------------------------------------
# POOL side — who may borrow. Assigned to AdapterPool, NOT to Adapter.
#
# These moved off Adapter in the reworked increment 1. Lending is a property of the POOL,
# which is the thing that owns processes; an individual Adapter never lends, it either owns
# a private process or borrows one. Carrying the lending scope on Adapter (as the first cut
# of this model did) would have allowed two adapters in the same tenant to declare different
# lending scopes over what is really one set of processes.
# ---------------------------------------------------------------------------------------
- id: AdapterSharingMode
  valueType: Enum
  valueCkEnumId: ${this}/AdapterSharingMode
  description: 'Whether and to whom an adapter pool lends its members, i.e. which part of the tenant tree may be handed a lease on it (AB#4924). NotShared (default) makes the pool private to its owning tenant, which is a legitimate configuration — a pool is still useful as a way to run one tenant''s own workloads elastically. The trust direction is fixed by the tenant tree and is never configurable upwards: a descendant can not lend to its ancestors (concept §3).'
  isRuntimeState: false
  defaultValues:
    - 0
- id: LendingAllowedTenantIds
  valueType: StringArray
  description: 'Optional allow-list narrowing the tenants an adapter pool with AdapterSharingMode != NotShared lends to (AB#4924). Absent or empty means "every tenant the sharing mode resolves to". A listed tenant that the sharing mode does NOT resolve to is ignored, never granted — the allow-list is an INTERSECTION with the tenant subtree, never a way around it, so the lending scope can not be widened past the trust boundary the tenant tree establishes.'
  isRuntimeState: false
- id: LendingMaxConcurrentLeasesPerTenant
  valueType: Int
  description: 'Optional upper bound on how many of this pool''s leases a single borrowing tenant may hold at the same time (AB#4924). Unset means no per-tenant cap — MaxReplicas and the round-robin rotation are the real bounds, which is why concept §8 Q11 deliberately left it without a default rather than inventing a number. Set it where one borrower is known to produce bursts (concept §6, "A borrowed tenant floods the queue"). It caps CONCURRENCY, not queue depth: excess work items stay Queued and visible in all three surfaces instead of being rejected.'
  isRuntimeState: false

# ---------------------------------------------------------------------------------------
# BORROWER side — moved out of this file in AB#5271.
#
# 4.0.0 put LentFromTenantId / LentFromAdapterPoolRtId here as plain attributes because a CK
# association cannot cross a tenant database. AB#5271 removes that constraint by mirroring the
# lent pool into the borrower as a local LentAdapterPool entity, so the adapter now carries an
# ordinary association (associations/lentFrom.yaml) and the cross-tenant reference lives once on
# the mirror (records/lenderReference.yaml) instead of twice on every leased adapter.
# ---------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------
# EXECUTION side — runtime state written by the lease, on PipelineExecution in the
# BORROWING tenant. Never seeded, never author-set.
# ---------------------------------------------------------------------------------------
- id: LeasedFromTenantId
  valueType: String
  isRuntimeState: true
  description: 'The lending tenant whose adapter pool served this execution (AB#4924). Written when the lease is granted. Together with LeasedFromPoolRtId it is what makes concept §4b''s attribution exact: consumption is billed to the tenant whose work ran — this execution''s own tenant — and the pool named here is where the per-member sizing that prices it comes from. Unset on a dedicated (AlwaysOn / OnDemand) adapter, which never leases.'
- id: LeasedFromAdapterPoolRtId
  valueType: String
  isRuntimeState: true
  description: 'RtId of the AdapterPool inside LeasedFromTenantId that served this execution (AB#4924). Bare 24-character hexadecimal RtId. Recorded per execution rather than read back from the adapter''s LentFromPoolRtId because the borrowing adapter can be re-pointed at a different pool later, and a cost report over past executions must reflect where the work actually ran.'
- id: LeasedOnMemberId
  valueType: String
  isRuntimeState: true
  description: 'Identity of the individual pool member (the process) that held the lease for this execution (AB#4924). This is what concept §5 calls "an association from the execution to the assigned member" — it can NOT be an association, because the member belongs to the lending tenant''s database and this execution to the borrower''s (see the file header). It is also not an RtId: members are replicas of one pool workload, not separate entities, so the value is the member''s stable runtime identity (its pool-hub registration id). It exists so the per-adapter queue view — "what is this member holding, what waits behind it" — can be projected out of the pool queue.'
# AB#5279 — the invoker of a queued work item. On a dedicated adapter the invoker of
# POST /pipeline/execute travels on the execute command (AB#5126) and never touches the
# database; on a leased adapter the work item waits in the queue, in ANOTHER request's
# lifetime, so the only place the identity can survive until the lease is granted is the
# execution entity itself. Token-free projection of ExecutePipelineCaller, one attribute per
# field so the queue view can show who is waiting without parsing anything. All optional and
# all isRuntimeState: written once at enqueue, never seeded, meaningless on a dedicated adapter.
- id: CallerSubjectId
  valueType: String
  isRuntimeState: true
  description: 'Subject (sub, or client_id for a client-credentials caller) of the invoker this queued work item was created for (AB#5279). Unset when the item was queued without an invoker — a cron tick or an internal caller.'
- id: CallerTenantId
  valueType: String
  isRuntimeState: true
  description: 'Tenant claim of the invoker of this queued work item (AB#5279).'
- id: CallerEmail
  valueType: String
  isRuntimeState: true
  description: 'E-mail claim of the invoker of this queued work item (AB#5279).'
- id: CallerName
  valueType: String
  isRuntimeState: true
  description: 'Display name (name / preferred_username) of the invoker of this queued work item (AB#5279).'
- id: CallerRoles
  valueType: StringArray
  isRuntimeState: true
  defaultValues: []
  description: 'Role claims of the invoker of this queued work item (AB#5279).'
- id: CallerTrustLevel
  valueType: Int
  isRuntimeState: true
  description: 'Trust the invoker established (AB#5279): 2 = strongly authenticated (bearer on the execute route), 1 = weak, 0 = none. Mirrors CallerTrustLevel of the pipeline SDK.'
- id: CallerAccessToken
  valueType: String
  isRuntimeState: true
  description: 'The invoker''s bearer token for delegation, ENCRYPTED with the controller''s instance key (enc:v1: sentinel) — never plaintext (AB#5279). Written only when the controller has an encryption key; read back and decrypted at lease grant, dropped there when expired. Unset when no token was carried or no key was configured.'
