$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
  # AB#5187. Runtime state, correcting the AB#5027 split: ClientSecret was marked and ClientId
  # was not, so a blueprint re-apply preserved the live secret and RESET the client id to the
  # seed's `<finapi-client-id-here>` placeholder — half a credential, which fails exactly like
  # no credential at all but looks configured in the Studio. A client id is issued to the
  # TENANT by the external provider (finAPI) or by an Azure app registration; a blueprint can
  # only ever seed a placeholder.
  #
  # BLAST RADIUS: shared with ServiceAccountConfiguration and MicrosoftGraphConfiguration.
  #   * MicrosoftGraph — the tenant's own app-registration id, part of the reported incident.
  #     Unambiguously correct.
  #   * ServiceAccountConfiguration — the client id of the pipeline service account, which
  #     PipelineServiceAccountProvisioningService derives from the adapter rtId and writes at
  #     runtime; no service-managed blueprint seeds that entity. The cost is that an app
  #     blueprint which does seed one (e.g. MeshmakersAccounting's `accounting-ai-prompt`)
  #     can no longer RENAME the client on an existing tenant — rename through Studio or the
  #     reconcile endpoint instead.
  - id: ClientId
    valueType: String
    isRuntimeState: true
    description: "OAuth2 Client ID for authenticating with the external API. Runtime state (AB#5187): issued to the tenant by the external provider, preserved across blueprint re-apply — a seed can only carry a placeholder."
  # AB#5027. Runtime state, NOT author configuration: a client secret is issued by the
  # identity provider (or pasted in by an admin) *after* the entity exists — a blueprint
  # can only ever seed a placeholder for it. Without this marker every service-managed
  # blueprint re-apply overwrote the live secret with that placeholder and broke the
  # affected configuration until someone re-entered it by hand.
  #
  # BLAST RADIUS: this attribute definition is shared — it is referenced by
  # ServiceAccountConfiguration, FinApiConfiguration and MicrosoftGraphConfiguration.
  # All three now keep their secret across a re-apply. That is intentional and correct
  # for all three (same reasoning), but it does mean a blueprint can no longer *change*
  # a ClientSecret on an existing tenant — document new secrets in release notes and
  # rotate them through Studio / the provisioning path instead.
  #
  # First install is unaffected: the engine's preservation only rewrites an incoming
  # value when the target entity already exists AND already has a value for the
  # attribute (ImportRtModelCommand.PreserveAttributesForEntity). A fresh tenant, or a
  # pre-existing entity that has never had a ClientSecret, still gets the seeded value.
  - id: ClientSecret
    valueType: String
    isRuntimeState: true
    description: "OAuth2 Client Secret for authenticating with the external API. Runtime state (AB#5027): issued/rotated at runtime, preserved across blueprint re-apply."
  # AB#5187 — the last member of the finAPI connection tuple. finAPI credentials are
  # environment-bound (a sandbox client id does not work against live), so this flag belongs
  # to the same unit as Host / ClientId / ClientSecret / Username / Password, all of which are
  # preserved. Resetting it alone would point a live credential at the sandbox host.
  - id: IsSandbox
    valueType: Boolean
    isRuntimeState: true
    description: "If true, the adapter connects to the sandbox environment instead of production. Runtime state (AB#5187): part of the tenant's finAPI connection tuple, preserved with it."
