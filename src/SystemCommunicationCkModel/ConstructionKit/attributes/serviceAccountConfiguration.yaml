$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
  # AB#5111 — the declarative half of a pipeline service account. The two attributes below are
  # AUTHOR configuration (deliberately NOT isRuntimeState): they state what the identity client
  # SHOULD look like, a blueprint may seed and change them, and the reconcile
  # (PipelineServiceAccountProvisioningService.ReconcileServiceAccountAsync) materialises them
  # into the identity client on every pass. The runtime half — the issued ClientSecret — stays
  # runtime state (see attributes/finApiConfiguration.yaml).
  - id: AssignedRoleNames
    valueType: StringArray
    description: "Declared roles of the identity client (AB#5111). When set, the reconcile syncs the client's AssignedRole edges to exactly this list — missing roles are added, superfluous ones removed. When absent, the account is in legacy (pre-declarative) mode: the reconcile leaves the client's roles completely untouched, so role edges granted by hand or by a blueprint survive. Setting this attribute is the explicit opt-in to declarative role management."
  - id: AllowDelegation
    valueType: Boolean
    description: "Whether the identity client carries the on-behalf-of delegation grant (urn:meshmakers:params:oauth:grant-type:on-behalf-of, AB#5026/AB#5031). Absent means true — the pre-AB#5111 behaviour, where every provisioned pipeline service account got the grant. Set to false to make the account strictly client_credentials."
