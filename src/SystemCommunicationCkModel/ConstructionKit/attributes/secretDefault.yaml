$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
# AB#7243 — attributes of the platform secret defaults: the SecretDefaults list an Application
# declares (record SecretDefaultProjection) and the platform-owned SecretDefault entity the
# controller projects it into.
#
# 🔴 Every attribute of value type Secret takes ownership Secret and nothing else (the engine's
# SecretAttributeValidator refuses any other combination), so the secret member below declares no
# other marker. Reads report only whether it is set, never the plaintext.
#
# 🔴 The Key / AllowedTenantIds / SecretValue members of the record are TenantOwned like the
# SecretDefaults attribute that holds them: an operator types them, so a blueprint re-apply must
# never reset a rotated secret to the seed's placeholder.
#
# 🔴 SourceTenantId, SourceWorkloadRtId and LastProjectedAt on the SecretDefault entity are
# RuntimeState: only the controller writes them, a blueprint re-apply must not touch them.
attributes:
- id: SecretDefaults
  valueType: RecordArray
  valueCkRecordId: ${this}/SecretDefaultProjection
  ownership: TenantOwned
  description: 'Secret defaults this Application declares for every tenant it serves (AB#7243). Optional, and only on Application. Each entry is projected by the controller into a platform-owned SecretDefault entity in the Application''s own tenant and its whole subtree; the target set is never widened, only narrowed by AllowedTenantIds. 🔴 This is NOT a ValueOverride: it never reaches Helm values, the pod or the app''s Kubernetes Secret. Keep at most one entry per Key.'
- id: SecretDefaultKey
  valueType: String
  ownership: TenantOwned
  description: 'Member of the SecretDefaultProjection record (AB#7243): the record key and the well-known name of the SecretDefault the controller creates in every target tenant (e.g. ec-captcha-secret). Identifies the entry inside SecretDefaults; keep it unique per Application.'
- id: SecretDefaultValue
  valueType: Secret
  ownership: Secret
  # AB#8594: the value of a platform-only secret; marks it for the T7a tightening (Hidden on SecretDefault.Value).
  securitySensitive: true
  description: 'The secret default value (AB#7243): member SecretValue of the SecretDefaultProjection record and attribute Value of the SecretDefault entity. Write the plaintext (never an encrypt-value ciphertext); the engine encrypts it. Reads only report whether it is set. 🔴 On the SecretDefault entity it is platform-only: no tenant pipeline, user or role may reveal it.'
- id: SecretDefaultAllowedTenantIds
  valueType: StringArray
  ownership: TenantOwned
  description: 'Member of the SecretDefaultProjection record (AB#7243): optional allow-list that NARROWS the target tenants of one default. Absent or empty means the Application''s own tenant plus its whole subtree. A listed tenant outside that subtree is ignored, never granted: the list is an intersection, never a way to widen the target set.'
- id: SecretDefaultDescription
  valueType: String
  ownership: TenantOwned
  description: 'Member of the SecretDefaultProjection record (AB#7243): optional free text saying what the default is for. Never holds the value itself.'
- id: SecretDefaultSourceTenantId
  valueType: String
  ownership: RuntimeState
  description: 'Tenant of the Application that declared this SecretDefault (AB#7243). Set by the controller; never author-set.'
- id: SecretDefaultSourceWorkloadRtId
  valueType: String
  ownership: RuntimeState
  description: 'Bare RtId of the Application that declared this SecretDefault (AB#7243). Set by the controller; never author-set.'
- id: SecretDefaultLastProjectedAt
  valueType: DateTime
  ownership: RuntimeState
  description: 'UTC timestamp of the last time the controller projected this SecretDefault (AB#7243). Set by the controller; never author-set.'
