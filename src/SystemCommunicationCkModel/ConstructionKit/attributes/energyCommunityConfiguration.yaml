$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
  - id: EnergyCommunityId
    valueType: String
    description: "ID of the energy community"
  - id: NetworkPartnerId
    valueType: String
    description: "ID of the network partner (Marktpartner"
  - id: HeaderLogo
    valueType: BinaryLinked
    description: "Icon for the app header"
  - id: FooterLogo
    valueType: BinaryLinked
    description: "Icon for the app footer"
  - id: ConsumptionRecordRequestDelay
    valueType: Int
    description: "Delay in days before automatic consumption record requests are sent"
    defaultValues:
      - 5
  - id: ConsumerPrice
    valueType: Double
    description: "Price per kWh for consumers in the energy community"
  - id: ProducerPrice
    valueType: Double
    description: "Price per kWh for producers in the energy community"
  - id: PrimaryColor
    valueType: String
    description: The primary color of the theme
  - id: SecondaryColor
    valueType: String
    description: The secondary color of the theme
  - id: TertiaryColor
    valueType: String
    description: The tertiary color of the theme
  - id: NeutralColor
    valueType: String
    description: The neutral color of the theme
  - id: UiThemeColors
    valueType: Record
    valueCkRecordId: ${this}/UiThemeColors
    description: Theme color configuration for an application
  - id: AppTitle
    valueType: String
    description: "Browser tab title of the web application"
  - id: AppHeading
    valueType: String
    description: "Heading displayed in the application header bar"
  - id: BillingReportName
    valueType: String
    description: "Name of the Telerik billing report template (e.g. SBEG_Billing.trdp)"
  - id: HeaderGradientStart
    valueType: String
    description: "Start color of the header gradient"
  - id: HeaderGradientEnd
    valueType: String
    description: "End color of the header gradient"
  - id: FooterGradientStart
    valueType: String
    description: "Start color of the footer gradient"
  - id: FooterGradientEnd
    valueType: String
    description: "End color of the footer gradient"
  - id: BackgroundColor
    valueType: String
    description: "Background color of the web application"
  - id: Favicon
    valueType: BinaryLinked
    description: "Favicon icon for the web application"
  - id: TaxRate
    valueType: Double
    description: "Tax rate applied to energy transactions in the community"
    defaultValues:
      - 20.0
  - id: FarmerTaxRate
    valueType: Double
    description: "Tax rate applied to farmers in the energy community"
    defaultValues:
      - 13.0