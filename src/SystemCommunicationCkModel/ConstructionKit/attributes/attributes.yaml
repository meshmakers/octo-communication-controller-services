$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
- id: AdapterType
  valueType: String
- id: LastSeen
  valueType: DateTime  
- id: Deployment.ImageName
  valueType: String  
- id: Deployment.ImageVersion
  valueType: String
- id: CommunicationState
  valueType: Enum
  valueCkEnumId: System.Communication/CommunicationState
  defaultValues:
    - 0
- id: ConfigurationState
  valueType: Enum
  valueCkEnumId: System.Communication/ConfigurationState 
  defaultValues:
    - 0
- id: DeploymentState
  valueType: Enum
  valueCkEnumId: System.Communication/DeploymentState
  defaultValues:
    - 0
- id: AdapterConfiguration
  valueType: String     
- id: AdapterPipelineConfiguration
  valueType: String
- id: RetrieverPipelineConfiguration
  valueType: String  
- id: SenderPipelineConfiguration
  valueType: String  