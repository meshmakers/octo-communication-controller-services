$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
- id: CommunicationStateTimestamp
  valueType: DateTime
  description: Timestamp of the last communication state change (online/offline transition).
- id: CommunicationState
  valueType: Enum
  valueCkEnumId: ${this}/CommunicationState
  description: Current SignalR connection state of the adapter or pool operator.
  defaultValues:
    - 0
- id: ConfigurationState
  valueType: Enum
  valueCkEnumId: ${this}/ConfigurationState
  description: Current configuration deployment state of the adapter or pool.
  defaultValues:
    - 0
- id: DeploymentState
  valueType: Enum
  valueCkEnumId: ${this}/DeploymentState
  description: Current deployment state of the entity (undeployed, pending, deployed, or error).
  defaultValues:
    - 0
- id: Environment
  valueType: Enum
  valueCkEnumId: ${this}/Environment
  description: Where the pool's adapter workloads are hosted. Edge (default) means an external operator installs and runs the pool; Cloud means the central Communication Operator auto-deploys it into the OctoMesh cluster.
  defaultValues:
    - 0
- id: AdapterConfiguration
  valueType: String
  description: JSON-serialized adapter-specific configuration that is deployed to the adapter.
- id: PipelineDefinition
  valueType: String
  description: JSON-serialized pipeline node graph that defines the data processing logic.
  defaultValues:
    - ""
- id: StatusMessage
  valueType: String
  description: Human-readable status or error message from the last deployment or configuration attempt.
- id: SenderEmail
  valueType: String
  description: Email address used as the sender (From) for outgoing emails.

# Pipeline Execution attributes
- id: ExecutionId
  valueType: String
  description: Unique identifier (GUID) for this execution
- id: ExecutionStatus
  valueType: Enum
  valueCkEnumId: ${this}/PipelineExecutionStatus
  description: Current status of the pipeline execution (Running, Completed, Failed, Interrupted, Cancelled).
  defaultValues:
    - 0
- id: TriggerType
  valueType: Enum
  valueCkEnumId: ${this}/PipelineTriggerType
  description: How this pipeline execution was initiated (Manual, Scheduled, Event, or Startup).
  defaultValues:
    - 0
- id: StartedAt
  valueType: DateTime
  description: Timestamp when execution started
- id: CompletedAt
  valueType: DateTime
  description: Timestamp when execution completed
- id: DurationMs
  valueType: Int
  description: Execution duration in milliseconds
- id: ErrorMessage
  valueType: String
  description: Error message if execution failed
- id: InputData
  valueType: String
  description: Optional input data (JSON) for debugging
- id: OutputData
  valueType: String
  description: Optional output data (JSON) from pipeline execution result
# Pipeline Statistics attributes
- id: LastHourSuccessCount
  valueType: Int
  description: Successful executions in the last hour
  defaultValues:
    - 0
- id: LastHourFailureCount
  valueType: Int
  description: Failed executions in the last hour
  defaultValues:
    - 0
- id: LastHourAvgDurationMs
  valueType: Int
  description: Average execution duration in the last hour (ms)
  defaultValues:
    - 0
- id: Last12HoursSuccessCount
  valueType: Int
  description: Successful executions in the last 12 hours
  defaultValues:
    - 0
- id: Last12HoursFailureCount
  valueType: Int
  description: Failed executions in the last 12 hours
  defaultValues:
    - 0
- id: Last12HoursAvgDurationMs
  valueType: Int
  description: Average execution duration in the last 12 hours (ms)
  defaultValues:
    - 0
- id: Last24HoursSuccessCount
  valueType: Int
  description: Successful executions in the last 24 hours
  defaultValues:
    - 0
- id: Last24HoursFailureCount
  valueType: Int
  description: Failed executions in the last 24 hours
  defaultValues:
    - 0
- id: Last24HoursAvgDurationMs
  valueType: Int
  description: Average execution duration in the last 24 hours (ms)
  defaultValues:
    - 0
- id: Last30DaysSuccessCount
  valueType: Int
  description: Successful executions in the last 30 days
  defaultValues:
    - 0
- id: Last30DaysFailureCount
  valueType: Int
  description: Failed executions in the last 30 days
  defaultValues:
    - 0
- id: Last30DaysAvgDurationMs
  valueType: Int
  description: Average execution duration in the last 30 days (ms)
  defaultValues:
    - 0
- id: LastUpdatedAt
  valueType: DateTime
  description: When statistics were last calculated
- id: LastExecutionAt
  valueType: DateTime
  description: Timestamp of the most recent execution

# Adapter offline sync attribute
- id: LastSyncedSequenceNumber
  valueType: Int
  description: Last synced sequence number for offline sync
  defaultValues:
    - 0

# Pipeline debugging
- id: IsDebuggingEnabled
  valueType: Boolean
  description: 'Whether debugging is enabled for this pipeline'

# Workload security
- id: ReceivesClusterSecrets
  valueType: Boolean
  description: 'When true, the Communication Operator injects cluster-internal credentials (MongoDB user/admin passwords, CrateDB password, RabbitMQ password) into the Adapter''s Helm release as secret-flagged value overrides. Defaults to false so untrusted or edge adapters do not receive cluster credentials by accident; enable only for adapters that run in the same cluster as the OctoMesh core services and need to talk to them directly.'
  defaultValues:
    - false

# DataPoint / MappingTarget record attributes
- id: SourceIdentifier
  valueType: String
  description: Identifier of the source entity (e.g. Loxone Control UUID, MQTT device ID)
- id: ExternalId
  valueType: String
  description: External identifier of the data point (e.g. Loxone State UUID, MQTT Topic, OPC-UA NodeId, Modbus Register)
- id: CurrentValue
  valueType: String
  description: Current value of the data point as a string (numeric conversion happens during mapping evaluation)
- id: LastUpdate
  valueType: DateTime
  description: Timestamp of the last value update for this data point

# Data point mapping
- id: SourceAttributePath
  valueType: String
  description: Path to the source attribute to read (e.g., CurrentValue, or nested record.field). If not set, the adapter determines the default.
- id: TargetAttributePath
  valueType: String
  description: Path to the target attribute to update on the mapped entity (e.g., Temperature, Humidity, or nested record.field)
- id: MappingExpression
  valueType: String
  description: 'Optional mXparser expression to transform the source value. Variable value contains the source value.'
