$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
  - id: Host
    valueType: String
    description: 'The host name is the name of the server on which the external system is running.'
  - id: Port
    valueType: Int
    description: 'The port number is the number of the port on which the external system is listening for incoming connections.'
  - id: Username
    valueType: String
    description: 'The username is the name of the user that is used to authenticate with the external system.'
  - id: Password
    valueType: String
    description: 'The password is the secret that is used to authenticate with the external system.'
  - id: IsSslEnabled
    valueType: Boolean
    description: 'The Secure Sockets Layer (SSL) protocol is used to secure communication between a client and a server.'
  - id: SystemNumber
    valueType: String
    description: 'The system number is a two-digit number assigned to an SAP system during installation. It is used to identify the SAP service (e.g. Dispatcher) on a specific port.'
  - id: SystemId
    valueType: String
    description: 'The System ID (SID) is the unique technical name of an SAP system. It consists of three letters and uniquely identifies a system within a landscape.'
  - id: SapClient
    valueType: String
    description: 'A client is a tenant instance in an SAP system. SAP is multi-tenant, which means that multiple organizations or departments can work on the same system without sharing data with each other.'
  - id: SapLanguage
    valueType: String
    description: 'The language key is a two-character code that identifies the language in which the user interface is displayed.'
  - id: SapTrace
    valueType: String
    defaultValues:
      - 8
    description: 'The trace level is a number that determines the amount of information that is logged during communication with the SAP system.'
  - id: SapGatewayHost
    valueType: String
    description: 'An SAP gateway host is a server that provides communication services between SAP systems or between SAP systems and external applications.'
  - id: SapGatewayService
    valueType: String
    description: 'An SAP gateway service provides communication services that are used between SAP systems or between SAP systems and external applications.'
  - id: SapProgramId
    valueType: String
    description: 'A program ID is a unique identifier that is used to register a program on an SAP gateway server.'
  - id: SapRegistrationCount
    valueType: Int
    description: 'The registration count is the number of times a program is registered on an SAP gateway server.'
  - id: MaxConcurrentConnections
    valueType: Int
    description: 'The maximum number of concurrent connections is the maximum number of connections that can be established with an external system at the same time.'
  - id: PrivateKey
    valueType: String
    description: 'The private key is a secret key that is used in asymmetric encryption to authenticate with the external system.'
  - id: PrivateKeyPassphrase
    valueType: String
    description: 'The private key passphrase is a secret that is used to protect the private key.'
  - id: Folder
    valueType: String
    description: 'The mailbox folder to monitor for incoming emails (e.g. INBOX).'
  - id: AzureTenantId
    valueType: String
    description: 'The Azure Active Directory tenant ID (GUID) for OAuth2 authentication.'
  - id: PollIntervalSeconds
    valueType: Int
    description: 'Interval in seconds between polling cycles.'
    defaultValues:
      - 30
  - id: IssuerUri
    valueType: String
    description: 'URI of the OAuth2/OpenID Connect authorization server (e.g. https://identity.example.com)'
  - id: MappingTargets
    valueType: RecordArray
    valueCkRecordId: ${this}/MappingTarget
    description: 'Resolved mapping targets for data acquisition. Populated automatically by the BuildMappingTargets pipeline node from DataPointMappings.'
  - id: BotToken
    valueType: String
    description: 'The bot token used as the `Authorization: Bot {token}` header when calling the Discord REST API.'
  - id: GuildId
    valueType: String
    description: 'The Discord guild (server) snowflake ID. Reserved for future channel-name resolution; not read by the ToDiscord node in v1.'
  - id: ApiKey
    valueType: String
    description: 'API key for authenticating with the AI service (e.g. Anthropic sk-ant-... key). Stored as configuration attribute, not exposed in pipeline data context.'
  - id: AiModel
    valueType: String
    description: 'AI model identifier to use (e.g. claude-sonnet-4-6, claude-opus-4-1). Mandatory and has no default: a pinned model id goes out of date (a retired "-20250514" snapshot returns HTTP 404), so it must be set explicitly on each AiConfiguration.'
  - id: MaxTokens
    valueType: Int
    description: 'Maximum number of tokens for the AI response.'
    defaultValues:
      - 4000
  - id: Temperature
    valueType: Double
    description: 'Temperature for AI response generation (0.0 = deterministic, 1.0 = creative).'
    defaultValues:
      - 0.1
  - id: McpServerUrl
    valueType: String
    description: 'URL of the OctoMesh MCP server for AI tool use (e.g. https://localhost:5017). The tenant ID is appended automatically.'
