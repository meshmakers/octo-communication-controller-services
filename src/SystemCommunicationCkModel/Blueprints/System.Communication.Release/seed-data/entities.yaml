$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - System.Communication-3.21.0
entities:
  # ---------------------------------------------------------------------------
  # HelmRepositoryConfiguration — meshmakers public release channel. The
  # Adapter below pulls its chart from this repo. The MainLatest variant
  # uses a different repo (meshmakers-dev) under a different rtId, so a
  # tenant migrating staging→prod will land here with meshmakers-public and
  # the Adapter relinked to it.
  # ---------------------------------------------------------------------------
  - rtId: '670000000000000000000004'
    ckTypeId: System.Communication/HelmRepositoryConfiguration
    rtWellKnownName: meshmakers-public
    attributes:
      - id: System.Communication/RepositoryUrl
        value: https://meshmakers.github.io/charts
      - id: System.Communication/Channel
        value: 1   # Release
      - id: System.Communication/Username
        value: ""
      - id: System.Communication/Password
        value: ""

  # ---------------------------------------------------------------------------
  # HelmRepositoryConfiguration — meshmakers public apps catalog. Seeded
  # alongside meshmakers-public so admins can attach Application workloads
  # (e.g. dashboards, demo apps) to this release-channel apps repo without
  # having to register it manually. No service-managed workload links here:
  # the Mesh Adapter stays on meshmakers-public (its chart lives there).
  # Admins point their own Application entities at this rtId via the
  # HelmRepository association.
  # ---------------------------------------------------------------------------
  - rtId: '670000000000000000000005'
    ckTypeId: System.Communication/HelmRepositoryConfiguration
    rtWellKnownName: meshmakers-apps
    attributes:
      - id: System.Communication/RepositoryUrl
        value: https://meshmakers.github.io/apps
      - id: System.Communication/Channel
        value: 1   # Release
      - id: System.Communication/Username
        value: ""
      - id: System.Communication/Password
        value: ""

  # ---------------------------------------------------------------------------
  # Pool — Cloud-environment pool that the central Communication Operator owns.
  # The pool is the deployment target for the Adapter workload below. Shares its
  # rtId with the System.Communication.MainLatest variant so a tenant moving
  # between channels keeps the same Pool entity.
  # ---------------------------------------------------------------------------
  - rtId: '670000000000000000000001'
    ckTypeId: System.Communication/Pool
    rtWellKnownName: CommunicationPool
    attributes:
      - id: System/Name
        value: Default Cloud
      - id: System/Description
        # ${octo.environment} resolves to "staging" or "production" here (requires
        # gates this blueprint to those two values), so the description annotates
        # the channel without needing a separate string per environment.
        value: >-
          Cloud-environment pool created by the Communication blueprint
          (${octo.environment} environment). Cloud pools are auto-deployed by the
          central Communication Operator — the pool's Adapter is rolled out via Helm
          into the OctoMesh cluster on 'Deploy'.
      - id: System.Communication/Environment
        value: 1   # Cloud
      - id: System.Communication/DeploymentState
        value: 0   # Undeployed — operator confirms on first Deploy
      - id: System.Communication/CommunicationState
        value: 0   # Unregistered — no pool operator connected yet
      - id: System.Communication/ConfigurationState
        value: 0   # Unconfigured

  # ---------------------------------------------------------------------------
  # Adapter — Mesh-style adapter managed by the Cloud pool above. ChartVersion
  # is pinned to ${octo.version} on this variant — the release-channel chart's
  # version matches OctoMesh's appVersion 1:1 (both derived from the same r-tag),
  # so the first Deploy on a freshly attached tenant lands a working chart pull.
  # The CD pipeline (deploy-adapter-chart-octo-mesh-adapter-*) continues rolling
  # the version forward on every release.
  # ---------------------------------------------------------------------------
  - rtId: '670000000000000000000002'
    ckTypeId: System.Communication/Adapter
    rtWellKnownName: MeshAdapter
    associations:
      - roleId: System.Communication/Manages
        targetRtId: '670000000000000000000001'
        targetCkTypeId: System.Communication/Pool
      - roleId: System.Communication/HelmRepository
        targetRtId: '670000000000000000000004'
        targetCkTypeId: System.Communication/HelmRepositoryConfiguration
    attributes:
      - id: System/Name
        value: Mesh Adapter
      - id: System/Description
        value: >-
          Mesh adapter created by the Communication blueprint (OctoMesh
          ${octo.version}). Runs in the Communication Pool and hosts pipelines that
          the Communication Controller deploys. Connects to the AdapterHub via
          SignalR once deployed; while still Unregistered, no pipeline executions
          can run.
      - id: System.Communication/ChartName
        value: octo-mesh-adapter
      - id: System.Communication/ChartVersion
        value: "${octo.version}"
      - id: System.Communication/DeploymentState
        value: 0   # Undeployed
      - id: System.Communication/CommunicationState
        value: 0   # Unregistered
      - id: System.Communication/ConfigurationState
        value: 0   # Unconfigured
      - id: System.Communication/LastSyncedSequenceNumber
        value: 0
      - id: System.Communication/ReceivesClusterSecrets
        value: true
      # Pre-fill the public Hostname with the {{domain.NAME}} template syntax
      # so administrators can flip IngressEnabled later without having to type
      # the FQDN. The Communication Controller resolves {{domain.default}} at
      # Deploy time against its configured named domains (see
      # CommunicationControllerOptions.Domains) — on prod-1 this becomes
      # "adapter.prod-1.octo-mesh.com", on prod-2 "adapter.prod-2.octo-mesh.com",
      # etc. IngressEnabled stays false (default) so the Mesh Adapter remains
      # cluster-internal until an admin explicitly opts in.
      - id: System.Communication/Hostname
        value: "adapter.{{domain.default}}"
