$schema: https://schemas.meshmakers.cloud/blueprint-meta.schema.json
blueprintId: System.Communication-1.0.0
description: |
  Service-managed base blueprint for the Communication module. Seeds a Cloud-environment
  Pool and one managed Adapter on the active tenant so a freshly enabled tenant has a
  working deployment target without manually wiring the two entities. The OctoMesh
  convention "System.* = service-managed" applies: this blueprint is auto-applied by
  the Communication Controller on tenant enable / startup, and Studio surfaces it as
  read-only. The optional HelloCommunication blueprint (shipped through regular
  catalogs, not embedded) sits on top and adds a hello-world Pipeline for demos.

ckModelDependencies:
  # Range floor must match the CK model version this blueprint ships with — the engine's
  # CkModelUpgradeService picks MinVersion as the install target. We ship the blueprint embedded
  # in the same NuGet as System.Communication-3.20.0, so the floor and the on-disk CK model
  # are always in lockstep. Bump both together when the CK model version moves forward.
  - System.Communication-[3.20.0,4.0)

seedDataPath: seed-data/entities.yaml
