# Root-level CI pipeline for octo-communication-controller-services, using shared
# templates from octo-pipeline-templates@tpl-v1.0.0.
#
# Phase 7 finale (2026-06-14): the last two .NET services on the legacy
# devops-build/ flow get their root yaml. Without the migration the
# Directory.Build.props OctoCoreLibVersion + OctoCommVersion split that
# every csproj already references via $(OctoCoreLibVersion) /
# $(OctoCommVersion) is correct at restore but legacy CI has no way to
# trigger r-tag hotfix flows through hotfix-service.yml.
#
# controller-services-specific quirks preserved from the legacy YAML:
#   - SSHKey + submodules:recursive — checkout pulls private submodules.
#   - Build and both test steps pass /p:OctoPublishCkModel=false: they compile
#     the CK model and publish it nowhere. System.Communication is published by
#     the shared CK step after the tests (main -> private catalog, r* -> private
#     AND public).
#   - Two separate test steps:
#       1. Unit tests (TUnit) excluding *IntegrationTests.csproj.
#       2. Integration tests (xUnit) with publishTestResults: false —
#          the project does not reference Microsoft.Testing.Extensions.TrxReport,
#          so the --report-trx flag the ADO task appends fails with
#          "Unknown option". (xunit.v3 4.x runs on MTP v2, the same line the
#          private feed carries, so the extension could now be added.)
#   - Docker diagnostics + MongoDB pre-pull (mongo:8.0.15) before the
#     integration tests — they spin up Testcontainers MongoDB; pre-pull
#     avoids pull-time-out failures on cold agents.
#   - HAS push-nuget — controller-services publishes Meshmakers.Octo.Communication
#     NuGets (CommunicationController.Sdk, Common, Server contracts).
#   - HAS CK library output: SystemCommunicationCkModel.

name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

parameters:
  # Injected by the release train on r-tag builds so the whole chain pins the
  # scheduler-determined lib/comm release version (forwarded to
  # update-build-number.yml). Default 'auto' = no override (version computed
  # normally); the train injects the real version on r-tag.
  - name: octoCoreLibVersion
    type: string
    default: 'auto'
  - name: octoCommVersion
    type: string
    default: 'auto'

resources:
  # Chain link: exactly ONE upstream pipeline resource per repo. Pipeline
  # resource triggers do NOT batch, so a repo with two trigger parents is
  # started twice per main cascade. The chain is therefore a single-parent
  # tree; artificial ordering edges (marked below) resolve real DAG joins.
  # Full picture: octo-mesh-deployment/pipelines/orchestrator-ci.yml.
  # bot-services publishes the System.Bot CK model this repo restores.
  pipelines:
    - pipeline: octo-bot-services
      source: octo-bot-services-CI
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v1.0.0

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  tags:
    exclude:
      - '*'

variables:
  - group: GitSSHGroup
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: solutionFile
    value: 'Octo.CommunicationController.sln'
  - name: artifactsFrameworkVersion
    value: 'net10.0'
  - name: buildConfiguration
    value: 'Release'
  - name: buildPlatform
    value: 'Any CPU'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}
  # CK publish routing (OctoPublishCkCatalogs: private on main, private AND public on
  # r* tags; GitHub catalogs only on main/r*, incident: Industry.Basic-2.1.1) is
  # exported as a runtime variable by update-build-number.yml and consumed by the
  # shared CK step.

stages:
  - stage: Build
    jobs:
      - job: linux
        displayName: 'Build, test, push Docker image and NuGets'
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: templates/steps/update-build-number.yml@pipelineTemplates
            parameters:
              octoCoreLibVersionOverride: ${{ replace(parameters.octoCoreLibVersion, 'auto', '') }}
              octoCommVersionOverride: ${{ replace(parameters.octoCommVersion, 'auto', '') }}
          - checkout: self
            clean: true
            submodules: recursive
          - task: InstallSSHKey@0
            displayName: 'Install SSH key for submodules'
            inputs:
              knownHostsEntry: '$(SSHKnownHosts)'
              sshPublicKey: '$(SSHPublicKey)'
              sshPassphrase: '$(SSHPassphrase)'
              sshKeySecureFile: '$(SSHPrivateKeyFile)'
          - template: templates/steps/set-version.yml@pipelineTemplates
          - template: templates/steps/download-ca.yml@pipelineTemplates
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(solutionFile)'
              restoreArguments: '--force /p:OctoNugetPrivateServer=$(nugetPrivateServer)'
              noCache: true
          # The build compiles System.Communication and publishes it nowhere: the
          # CK step below owns publishing, and CkCompile would publish with isForced
          # hardcoded. No other CK in this solution depends on it, so a local catalog
          # would never be read; the model, its embedded blueprints and its
          # documentation are all produced by compiling alone. The command line
          # overrides the csproj's <OctoPublishCkModel>, which stays for local
          # development. The GitHub API keys keep CkCompile's catalog refresh clear
          # of GitHub's unauthenticated rate limit.
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(solutionFile)'
              arguments: '--configuration $(buildConfiguration) /p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoPublishCkModel=false /p:OctoPrivateGitHubApiKey=$(GitHubPAT) /p:OctoPublicGitHubApiKey=$(GitHubPAT)'
              publishWebProjects: false
              zipAfterPublish: false
              modifyOutputPath: false
          - script: |
              echo "=== Docker Diagnostics ==="
              echo "DOCKER_HOST: $DOCKER_HOST"
              docker version || echo "ERROR: Docker not available"
              docker info || echo "ERROR: Docker info failed"
              echo ""
              echo "=== Pre-pulling MongoDB image ==="
              docker pull mongo:8.0.15 || echo "Warning: Failed to pre-pull MongoDB image"
            displayName: 'Docker diagnostics and pre-pull'
            env:
              DOCKER_HOST: unix:///var/run/docker.sock
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Unit Tests (TUnit)'
            inputs:
              command: 'test'
              arguments: '--configuration $(buildConfiguration) -p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoPublishCkModel=false'
              projects: |
                **/*Tests.csproj
                !**/*IntegrationTests.csproj
                !**/*SystemTests.csproj
              testRunTitle: 'Unit Tests'
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Integration Tests (xUnit)'
            inputs:
              command: 'test'
              arguments: '--configuration $(buildConfiguration) -p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoPublishCkModel=false'
              projects: '**/*IntegrationTests.csproj'
              # publishTestResults disabled: the project does not reference
              # Microsoft.Testing.Extensions.TrxReport, so the --report-trx flag the
              # Azure DevOps task appends fails with "Unknown option". xunit.v3 4.x runs
              # on MTP v2 (the line the private feed carries), so the extension could be
              # added to re-enable publishing.
              publishTestResults: false
            env:
              DOCKER_HOST: unix:///var/run/docker.sock
          # CK SemVer and schema gate (AB#4420), and since tpl-v1.0.0 also the
          # publish of System.Communication (AB#5121): main -> private catalog, r*
          # tags -> private AND public, never replacing a published version. It runs
          # after both test steps so a run whose build or tests fail never leaves a
          # version in a shared catalog — a published version cannot be withdrawn.
          # The step compiles the model itself with the pinned octo-ckc, so it needs
          # nothing from the build; it only has to come before the image and the
          # NuGets.
          - template: templates/steps/validate-and-publish-ck-versions.yml@pipelineTemplates
            parameters:
              constructionKitPaths:
                - 'src/SystemCommunicationCkModel/ConstructionKit'
          # Communication Controller image
          # Multi-arch image (AB#4451): arm64 for Apple-Silicon kind clusters and
          # edge devices, amd64 for the managed clusters.
          - template: templates/steps/build-and-push-docker.yml@pipelineTemplates
            parameters:
              publicRegistryServiceConnection: $(DockerRegistryPublicConnection)
              privateRegistryName: $(DockerRegistryPrivateUri)
              repository: meshmakers/octo-mesh-communication-controller-services
              dockerfile: src/CommunicationControllerServices/Dockerfile
              platforms: 'linux/arm64,linux/amd64'
              enableMainLatestTag: true
          - template: templates/steps/handle-artifacts.yml@pipelineTemplates
            parameters:
              constructionKitLibraryPaths:
                - 'src/SystemCommunicationCkModel/bin/$(buildConfiguration)/$(artifactsFrameworkVersion)/octo-ck-libraries/SystemCommunicationCkModel'
          - template: templates/steps/push-nuget-package.yml@pipelineTemplates
