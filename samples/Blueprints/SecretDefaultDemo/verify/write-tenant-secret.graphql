# Writes the tenant's own CAPTCHA secret (the override). The secret is the variable $secretValue.
mutation writeTenantSecret($secretValue: String!) {
  runtime {
    secretDefaultDemoCaptchaConfigurations {
      update(entities: [{ rtId: "5ecdef0000000000000000b1", item: { captchaSecret: $secretValue } }]) {
        rtId
        captchaSecret {
          isSet
        }
      }
    }
  }
}
