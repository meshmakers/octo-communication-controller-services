# Clears the tenant's own CAPTCHA secret; VerifyCaptcha@1 falls back to the default again.
mutation clearTenantSecret {
  runtime {
    secretDefaultDemoCaptchaConfigurations {
      update(entities: [{ rtId: "5ecdef0000000000000000b1", item: {}, clearSecretAttributes: ["captchaSecret"] }]) {
        rtId
        captchaSecret {
          isSet
        }
      }
    }
  }
}
