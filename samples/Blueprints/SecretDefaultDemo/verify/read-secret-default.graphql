# Whether the projected default is in this tenant. SecretDefault.Value is Hidden (System.Communication
# 4.16.0 and later), so the entity itself is the "set" signal; no value or isSet marker is read.
query readSecretDefault {
  runtime {
    systemCommunicationSecretDefault(
      first: 1
      fieldFilter: [{ attributePath: "rtWellKnownName", operator: EQUALS, comparisonValue: "demo-captcha-secret" }]
    ) {
      totalCount
      items {
        rtWellKnownName
        sourceTenantId
        sourceWorkloadRtId
        lastProjectedAt
      }
    }
  }
}
