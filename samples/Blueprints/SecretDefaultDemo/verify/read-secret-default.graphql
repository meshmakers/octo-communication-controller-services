# Whether the projected default is in this tenant. Reads only the isSet marker, never a value.
query readSecretDefault {
  runtime {
    systemCommunicationSecretDefault(
      first: 1
      fieldFilter: [{ attributePath: "rtWellKnownName", operator: EQUALS, comparisonValue: "demo-captcha-secret" }]
    ) {
      items {
        rtWellKnownName
        sourceTenantId
        lastProjectedAt
        value {
          isSet
        }
      }
    }
  }
}
