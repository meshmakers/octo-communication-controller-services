# Adds the SecretDefaults entry to the sample Application (parent tenant). The secret is the
# variable $secretValue, never part of the document. The list replaces the whole SecretDefaults.
mutation writeSecretDefault($secretValue: String!, $allowedTenantIds: [String!]) {
  runtime {
    systemCommunicationApplications {
      update(
        entities: [
          {
            rtId: "5ecdef0000000000000000a1"
            item: {
              secretDefaults: [
                {
                  key: "demo-captcha-secret"
                  secretValue: $secretValue
                  allowedTenantIds: $allowedTenantIds
                  description: "Turnstile secret every served tenant verifies CAPTCHAs with unless it sets its own."
                }
              ]
            }
          }
        ]
      ) {
        rtId
        secretDefaults {
          key
          allowedTenantIds
          secretValue {
            isSet
          }
        }
      }
    }
  }
}
