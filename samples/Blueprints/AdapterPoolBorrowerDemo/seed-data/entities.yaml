$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json

# Required by the runtime-model schema, and not a duplicate of the blueprint's
# ckModelDependencies: this file is also importable on its own with ImportRt, and
# then it is the only place naming the model the type ids below belong to.
dependencies:
  - System.Communication-[4.0,5.0)

# AB#4924 — the borrowing half of shared adapter leasing.
entities:
  # ---------------------------------------------------------------------------
  # The Leased adapter. It owns no process: there is no chart, no replica count
  # and nothing for the operator to deploy. What it carries is a DECLARATION —
  # "my work runs on a member of that pool over there" — which the controller
  # checks against the pool's own SharingMode before it grants anything.
  # ---------------------------------------------------------------------------
  - rtId: '49240000000000000000bb01'
    ckTypeId: System.Communication/Adapter
    rtWellKnownName: LeasedAdapter
    associations:
      # Still hosted at a deployment site even though nothing is deployed there:
      # the site is where the adapter belongs in the topology, and the controller
      # reads it when it resolves the workload's pool.
      - roleId: System.Communication/Hosts
        targetRtId: '670000000000000000000001'
        targetCkTypeId: System.Communication/DeploymentSite
      # 🔴 AB#5271 — the borrower half is now an ASSOCIATION to a local mirror, not two
      # strings on this adapter. The mirror below is what carries the cross-tenant
      # reference, and it carries it once for every adapter in this tenant that borrows
      # from that pool.
      - roleId: System.Communication/LentFrom
        targetRtId: '49240000000000000000bb04'
        targetCkTypeId: System.Communication/LentAdapterPool
    attributes:
      - id: System/Name
        value: Leased Adapter
      - id: System/Description
        value: >-
          Adapter whose pipelines run on a borrowed pool member instead of a process of
          its own (AB#4924). It is never deployed; the lease is what gives it a runtime,
          one work item at a time.
      # 🔴 3 = Leased. Together with the LentFrom association above this is the
      # borrower's consent — the deploy guard refuses Leased without a mirror, and a
      # mirror without Leased, rather than half-applying either.
      - id: System.Communication/LifecycleMode
        value: 3
      - id: System.Communication/DeploymentState
        value: 0
      - id: System.Communication/CommunicationState
        value: 0
      - id: System.Communication/ConfigurationState
        value: 0

  # ---------------------------------------------------------------------------
  # The mirror of the lender's pool (AB#5271).
  #
  # 🔴 THIS ENTITY IS NORMALLY NOT SEEDED. The controller provisions it — see
  # AdapterPoolMirrorProvisioningService — and every attribute on it is runtime
  # state, so seeding one is exactly the shape blueprints are supposed to keep out
  # of. It is seeded here anyway, and the reason is worth stating: a blueprint needs
  # a FIXED rtId to point its LentFrom association at, and a controller-generated one
  # has none.
  #
  # It is safe because the sync service ADOPTS it rather than colliding with it: its
  # upsert is keyed on the Lender record below, not on the rtId, so the first
  # reconcile after this blueprint updates this very entity instead of adding a
  # second mirror of the same pool. What is seeded here is therefore a placeholder
  # the controller takes ownership of, not a competing source of truth.
  #
  # 🔴 And it grants nothing. The lease decision always re-reads the LENDER's own
  # AdapterPool and its SharingMode; this mirror only decides what the borrower SEES.
  # If `accounting` does not in fact lend here, the next reconcile REMOVES this
  # entity and the adapter above is left pointing at nothing — a refused deploy with
  # a named reason, which is the loud failure this sample wants.
  # ---------------------------------------------------------------------------
  - rtId: '49240000000000000000bb04'
    ckTypeId: System.Communication/LentAdapterPool
    rtWellKnownName: LentAccountingAdapterPool
    attributes:
      - id: System/Name
        value: Accounting Adapter Pool (lent)
      - id: System/Description
        value: >-
          Borrower-local mirror of the adapter pool owned by the lending tenant
          (AB#5271). Provisioned and kept in sync by the Communication Controller;
          seeded here only so this sample has a stable association target.
      - id: System.Communication/Lender
        value:
          ckRecordId: System.Communication/LenderReference
          attributes:
            # 🔴 Hard-coded; see the blueprint description. A blueprint cannot derive its
            # parent — there is no ${octo.parentTenantId}.
            - id: System.Communication/LenderTenantId
              value: accounting
            # The POOL, not a member: membership is elastic and a member id would be
            # stale the moment the pool scales.
            - id: System.Communication/LenderAdapterPoolRtId
              value: '49240000000000000000aa01'
      # 1 = Descendants, mirroring AdapterPoolDemo's pool. Display only — the lease
      # decision reads the lender's own value, never this one.
      - id: System.Communication/LentAdapterPoolSharingMode
        value: 1
      - id: System.Communication/LentAdapterPoolMinReplicas
        value: 1
      - id: System.Communication/LentAdapterPoolMaxReplicas
        value: 3
      # 0 = Undeployed until the lender deploys its pool and the fan-out updates this.
      - id: System.Communication/LentAdapterPoolDeploymentState
        value: 0

  - rtId: '49240000000000000000bb02'
    ckTypeId: System.Communication/DataFlow
    rtWellKnownName: LeasingProbeFlow
    attributes:
      - id: System/Name
        value: Leasing Probe

  # ---------------------------------------------------------------------------
  # The probe. Its job is to answer WHICH TENANT DATABASE the lease ran against,
  # which a marker string alone cannot do.
  # ---------------------------------------------------------------------------
  - rtId: '49240000000000000000bb03'
    ckTypeId: System.Communication/Pipeline
    rtWellKnownName: LeasingProbe
    associations:
      - roleId: System/ParentChild
        targetRtId: '49240000000000000000bb02'
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: '49240000000000000000bb01'
        targetCkTypeId: System.Communication/Adapter
    attributes:
      - id: System/Name
        value: Leasing Probe
      - id: System/Enabled
        value: true
      - id: System.Communication/DeploymentState
        value: 0
      - id: System.Communication/PipelineDefinition
        value: |
          triggers:
            # Not a cron trigger, deliberately: a bus trigger on a leased pipeline
            # runs OUTSIDE the lease bookkeeping today (runbook §9.5), which would
            # make this probe's own result untrustworthy.
            - type: FromExecutePipelineCommand@1
          transformations:
            - type: SetPrimitiveValue@1
              targetPath: $.marker
              valueType: String
              value: AB4924-LEASED-PROBE-OK
            - type: GetRtEntitiesByType@1
              description: >-
                Reads the adapters of WHICHEVER tenant database this actually ran
                against. The lender and the borrower hold different numbers of them,
                so the output alone settles the isolation question instead of merely
                proving that something executed.
              ckTypeId: System.Communication/Adapter
              targetPath: $.adaptersSeen
              identity: ServiceAccount
            - type: SetPipelineExecutionResult@1
              path: $
              maxLength: 20000
