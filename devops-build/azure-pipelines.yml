name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)

trigger:
  batch: true
  branches:
    include:
      - main
      - releases/2.0
  
variables:
  buildConfiguration: 'Release'
  buildPlatform: 'any cpu'
  solutionFile: "Octo.TimeSeries.sln"
  Company: "meshmakers GmbH"
  Copyright: "(c) 2022-2023 meshmakers GmbH"

stages:
 - stage: Build
   jobs:
     - job: local_build
       displayName: "Build nuget and execute tests"
       pool:
         name: Gerald-Local-Linux
       steps:
         - checkout: self
           clean: true
           submodules: true
         - template: setversion.yml
         - task: DotNetCoreCLI@2
           displayName: 'Test'
           inputs:
             command: 'test'
             projects: |
               '**/*Tests.csproj'
               !'**/*SystemTests.csproj'
             testRunTitle: 'CI'
         - template: buildAndPushDockerImage.yml
           parameters:
             ContainerRegistry: 'dockerhub@ianitor'
             Repository: meshmakers/octo-mesh-historian-rep-services
             Dockerfile: src/HistorianRepositoryServices/Dockerfile
         - task: CopyFiles@2
           displayName: 'Copy Files from $(Build.SourcesDirectory)/bin/$(BuildConfiguration)/**/*.nupkg to $(build.artifactstagingdirectory)'
           inputs:
             SourceFolder: $(Build.SourcesDirectory)
             Contents: |
               bin/$(BuildConfiguration)/**/*.nupkg
             TargetFolder: $(build.artifactstagingdirectory)
         - task: PowerShell@2
           displayName: 'Create versioninfo file'
           inputs:
             targetType: 'inline'
             script: |
               New-Item $(build.artifactstagingdirectory)/versioninfo.txt
               Set-Content $(build.artifactstagingdirectory)/versioninfo.txt $(Build.BuildNumber)
         - task: PublishBuildArtifacts@1
           displayName: 'Publish Artifact: local'
           inputs:
             ArtifactName: local
     

